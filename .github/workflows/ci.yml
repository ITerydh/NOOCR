name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # CI 装 CPU 轻量版（约 15MB）而非默认的 GPU 版（约 700MB）。
      # 二者产出的二进制完全相同，只是后者多了 CUDA provider，
      # CI 机器无 GPU，装了也是白装 700MB。GPU 路径由本地验收覆盖。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install ruff

      # Windows 控制台（pwsh）默认 cp1252，输出中文会抛 UnicodeEncodeError。
      # 包内 logging_config 也会做同样防护，这里再加一层是为了让 pip
      # 之类的第三方输出也不炸。PYTHONIOENCODING 对两个平台都有效。
      - name: 固定控制台编码
        run: |
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"
          python -X utf8 -c "print('encoding ok')"
        shell: bash

      - name: 静态检查
        run: ruff check noocr tests scripts

      - name: 多语言 README 一致性
        run: python scripts/check_readme.py

      - name: 单元测试（无需权重）
        # tests/ 下是可直接执行的脚本而非 pytest 用例：导入即跑、结尾
        # sys.exit()，交给 pytest 收集会在导入阶段报 INTERNALERROR。
        run: python tests/test_units.py

      # 仓库不携带权重（.gitignore已排除 models/），CI 必须自己拉。
      # 显式预热而不是依赖验收脚本隐式下载：下载失败时要能一眼看出是
      # 网络问题而不是代码问题。四个后端都要，因为验收会逐个跑——
      # 少拉一个，CI 就测不到那一档，将来注册表漏了档位也发现不了。
      #
      # 若ModelScope 仓库被设为私有，需要在仓库 Settings → Secrets 里
      # 配MODELSCOPE_TOKEN；公开仓库则匿名即可，无需任何配置。
      - name: 拉取权重
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          python -m noocr models --get ppocrv6-tiny
          python -m noocr models --get ppocrv6-small
          python -m noocr models --get ppocrv6-medium
          python -m noocr models --get ppocrv5

      - name: 端到端验收（拉起模型与 Web 服务）
        run: python scripts/acceptance.py

  gpu-probe:
    # GPU 专属：只验证「装上 onnxruntime-gpu 后 CUDA EP 会被正确识别」，
    # 不跑识别（CI 无 GPU）。GPU 性能由 scripts/perf/ 本地测量。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 GPU 版依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 验证 GPU 版可导入且 EP 齐全
        run: |
          python - <<'PY'
          import onnxruntime as ort
          provs = ort.get_available_providers()
          print("ORT", ort.__version__, "device:", ort.get_device())
          print("EPs:", provs)
          # 无 CUDA/cuDNN 时 CUDA EP 仍在列表里但初始化会失败，
          # 这属于预期——项目对此会明确警告并回退 CPU，不静默假装。
          assert "CPUExecutionProvider" in provs, provs
          assert "CUDAExecutionProvider" in provs, provs
          PY

      - name: 验证 CUDA 缺失时明确降级而非静默
        run: |
          python - <<'PY'
          from noocr.engine.session import detect_device
          d = detect_device("cuda")
          print("请求 cuda 实际得到:", d, "is_gpu =", d.is_gpu)
          # CI 无 GPU，必须回退到 CPU 且不能抛异常
          assert d.kind == "cpu", d
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 构建分发包
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 检查包内容
        run: |
          pip install twine
          twine check dist/*