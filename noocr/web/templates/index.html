<title>NOOCR · 文字识别</title>
<!-- 内联 SVG 图标：不额外发一次请求，也免掉 favicon.ico 的 404。
     底板用 currentColor 之外写死值，保证在浅色主题下也有对比度。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6ae0'/%3E%3Cpath d='M7 10h4M12 10h4M17 10h4M22 10h3M7 16h3M11 16h4M16 16h4M21 16h4M7 22h4M12 22h4M17 22h5' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   NOOCR UI v3 — 配色变量（浅色 / 深色两套）
   ------------------------------------------------------------
   v3 视觉层用!important 覆盖旧规则（尺寸、圆角、层次），
   所以它的颜色不能靠旧 token带着走——必须自成一套。
   浅色值即v3 段原先硬编码的那些，逐个搬进来，观感不变；
   深色另配一套，两个主题都由 data-theme / prefers-color-scheme
   切换，规则与旧 token 完全一致。
   ============================================================ */
:root {
  --v3-bg:#f5f7fb;
  --v3-panel:        rgba(255,255,255,.94);
  --v3-panel-solid:  #ffffff;
  --v3-surface:      rgba(255,255,255,.96);
  --v3-inset:        #f2f5f9;
  --v3-border:       #dfe6ef;
  --v3-border-strong:#dbe3ee;
  --v3-hairline:     #edf0f4;
  --v3-text:         #1d2939;
  --v3-text-2:       #667085;
  --v3-text-3:       #98a2b3;
  --v3-primary:      #397ff6;
  --v3-primary-soft: #f5f9ff;
  --v3-green:        #22a06b;
  --v3-red:          #f87171;
  --v3-ring:         rgba(57,127,246,.08);
  --v3-scrollbar:    #ccd5e1;
  --v3-checker:      #f2f5f9;
  --v3-cta:          linear-gradient(135deg, #4b8ff7 0%, #3479eb 100%);
  --v3-cta-shadow:   rgba(52,121,235,.19);
  --v3-cta-shadow-hi:rgba(52,121,235,.25);
  --v3-glow-1:       rgba(65, 133, 246, .055);
  --v3-glow-2:       rgba(79, 114, 190, .035);
  --v3-header-bg:     rgba(255,255,255,.90);
  --v3-header-border: rgba(215,224,235,.85);
  --v3-header-shadow: 0 1px 12px rgba(31, 56, 88, .035);
  --v3-card-h-bg:     linear-gradient(180deg, #fff, #fbfcfe);
  --v3-drop-bg:       linear-gradient(180deg, rgba(247,250,254,.92), rgba(250,252,255,.98));
  --v3-shadow:        0 8px 28px rgba(31, 56, 88, .065);
  --v3-shadow-hover:  0 12px 34px rgba(31, 56, 88, .105);
  /* 浮层：设备下拉。独立于 --v3-panel——浮层要压住页面内容，
     底色得比面板更实，否则下方的表格会透上来 */
  --v3-pop-bg:        rgba(255, 255, 255, .97);
  --v3-pop-border:    #d8e0eb;
  --v3-pop-shadow:    0 18px 48px rgba(31, 56, 88, .16);
  /* 悬停与选中：白底上用浅灰，深底上用微亮 */
  --v3-hover:         rgba(31, 56, 88, .05);
  --v3-sel-bg:        linear-gradient(90deg, rgba(57,127,246,.10), rgba(57,127,246,.04));
  --v3-radius:        14px;
  --v3-radius-sm:     9px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --v3-bg:#0b0f16;
  --v3-panel:        rgba(22,28,40,.94);
  --v3-panel-solid:  #161c28;
  --v3-surface:      rgba(18,24,34,.96);
  --v3-inset:        #11161f;
  --v3-border:       #26303f;
  --v3-border-strong:#334052;
  --v3-hairline:     #1e2634;
  --v3-text:         #e6edf3;
  --v3-text-2:       #a8b1bd;
  --v3-text-3:       #7b8492;
  --v3-primary:      #5b8cff;
  --v3-primary-soft: rgba(91,140,255,.12);
  --v3-green:        #3fb950;
  --v3-red:          #f85149;
  --v3-ring:         rgba(91,140,255,.20);
  --v3-scrollbar:    #3d444f;
  --v3-checker:      #1a212c;
  --v3-cta:          linear-gradient(135deg, #3f7ce8 0%, #2f62cf 100%);
  --v3-cta-shadow:   rgba(0,0,0,.40);
  --v3-cta-shadow-hi:rgba(0,0,0,.50);
  --v3-glow-1:       rgba(65, 133, 246, .10);
  --v3-glow-2:       rgba(79, 114, 190, .07);
  --v3-header-bg:     rgba(16,21,30,.88);
  --v3-header-border: rgba(48,58,74,.85);
  --v3-header-shadow: 0 1px 12px rgba(0,0,0,.45);
  --v3-card-h-bg:     linear-gradient(180deg, #161c28, #131924);
  --v3-drop-bg:       linear-gradient(180deg, rgba(26,33,45,.92), rgba(20,26,36,.98));
  --v3-shadow:        0 8px 28px rgba(0,0,0,.45);
  --v3-shadow-hover:  0 12px 34px rgba(0,0,0,.55);
  --v3-pop-bg:        rgba(18, 25, 37, .97);
  --v3-pop-border:    rgba(120, 151, 202, .28);
  --v3-pop-shadow:    0 18px 48px rgba(0,0,0,.42);
  --v3-hover:         rgba(255, 255, 255, .035);
  --v3-sel-bg:        linear-gradient(90deg, rgba(84, 139, 235, .12), rgba(84, 139, 235, .045));
}

/* 跟随系统（未手动设置时生效）——与上面旧 token 的写法保持一致 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --v3-bg:#0b0f16;
    --v3-panel:        rgba(22,28,40,.94);
    --v3-panel-solid:  #161c28;
    --v3-surface:      rgba(18,24,34,.96);
    --v3-inset:        #11161f;
    --v3-border:       #26303f;
    --v3-border-strong:#334052;
    --v3-hairline:     #1e2634;
    --v3-text:         #e6edf3;
    --v3-text-2:       #a8b1bd;
    --v3-text-3:       #7b8492;
    --v3-primary:      #5b8cff;
    --v3-primary-soft: rgba(91,140,255,.12);
    --v3-green:        #3fb950;
    --v3-red:          #f85149;
    --v3-ring:         rgba(91,140,255,.20);
    --v3-scrollbar:    #3d444f;
    --v3-checker:      #1a212c;
    --v3-cta:          linear-gradient(135deg, #3f7ce8 0%, #2f62cf 100%);
    --v3-cta-shadow:   rgba(0,0,0,.40);
    --v3-cta-shadow-hi:rgba(0,0,0,.50);
    --v3-glow-1:       rgba(65, 133, 246, .10);
    --v3-glow-2:       rgba(79, 114, 190, .07);
    --v3-header-bg:     rgba(16,21,30,.88);
    --v3-header-border: rgba(48,58,74,.85);
    --v3-header-shadow: 0 1px 12px rgba(0,0,0,.45);
    --v3-card-h-bg:     linear-gradient(180deg, #161c28, #131924);
    --v3-drop-bg:       linear-gradient(180deg, rgba(26,33,45,.92), rgba(20,26,36,.98));
    --v3-shadow:        0 8px 28px rgba(0,0,0,.45);
    --v3-shadow-hover:  0 12px 34px rgba(0,0,0,.55);
    --v3-pop-bg:        rgba(18, 25, 37, .97);
    --v3-pop-border:    rgba(120, 151, 202, .28);
    --v3-pop-shadow:    0 18px 48px rgba(0,0,0,.42);
    --v3-hover:         rgba(255, 255, 255, .035);
    --v3-sel-bg:        linear-gradient(90deg, rgba(84, 139, 235, .12), rgba(84, 139, 235, .045));
  }
}

/* ============================================================
   设计 token
   ------------------------------------------------------------
   颜色、字号、间距、圆角、阴影全部收敛到这里。此前各处随手
   写死了 12 个字号、20 个间距值、7 个圆角值，导致界面看着
   "大致整齐"却说不出哪里不对——根本原因是缺少体系。
   ============================================================ */
:root {
  /* 表面：层级越高越亮 */
  --bg:            #0d1117;
  --panel:         #161b22;
  --panel-2:       #1c2129;
  --panel-3:       #262c36;   /* 浮层：下拉、tooltip、toast */
  --inset:#0a0d12;   /* 凹陷：代码区、图像舞台 */

  /* 描边 */
  --border:        #2b313b;
  --border-strong: #3d444f;

  /* 文本（对比度全部 >= 4.5:1，WCAG AA）*/
  --text:     #e6edf3;        /* 14.9:1 */
  --text-dim: #a8b1bd;        /*  7.4:1 */
  --text-mute: #7b8492;       /*  4.6:1  由 #6b7280 提亮而来 */

  /* 主色。accent 用于文字/图标，accent-solid 用于实心按钮底
     —— 白字压 #5b8cff 只有 3.16:1，达不到 AA，必须区分开 */
  --accent:        #6f9bff;
  --accent-solid:  #2f6ae0;   /* 白字 4.6:1 */
  --accent-hover:  #3d78ea;
  --accent-dim:    #3a5bbf;
  --accent-subtle: rgba(111, 155, 255, .14);
  --accent-border: rgba(111, 155, 255, .36);

  /* 语义色：每色三件套（前景 / 底 / 边），消灭散落的 color-mix */
  --ok:      #3fb950;  --ok-subtle:   rgba(63, 185, 80, .14);  --ok-border:   rgba(63, 185, 80, .36);
  --warn:    #d29922;  --warn-subtle: rgba(210, 153, 34, .14); --warn-border: rgba(210, 153, 34, .36);
  --err:     #f85149;  --err-subtle:  rgba(248, 81, 73, .14);  --err-border:  rgba(248, 81, 73, .36);
  --info:    #58a6ff;  --info-subtle: rgba(88, 166, 255, .14); --info-border: rgba(88, 166, 255, .36);

  /* 置信度色阶：OCR 专用 */
  --conf-high: #3fb950;
  --conf-mid:  #d29922;
  --conf-low:  #f85149;

  /* 间距：4px 基数 */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px;
  --stage-max: 640px;

  /* 圆角 */
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;

  /* 阴影：亮色下纯黑阴影几乎不可见，改用带 alpha 的中性色 */
  --sh-1: 0 1px 2px rgba(1, 4, 9, .28);
  --sh-2: 0 8px 24px rgba(1, 4, 9, .38);
  --sh-3: 0 12px 32px rgba(1, 4, 9, .48);
  --shadow-color: rgb(1 4 9 / .5);

  /* 动效 */
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --dur-1: 120ms;
  --dur-2: 200ms;

  --radius: var(--r-lg);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas,
          "Noto Sans Mono CJK SC", monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
             "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}

/* 手动切换优先于跟随系统；JS 写data-theme 到 <html> */
:root[data-theme="light"] {
  color-scheme: light;
  --bg:     #ffffff;  --panel: #ffffff;  --panel-2: #f6f8fa;  --panel-3: #ffffff;
  --inset:  #f6f8fa;
  --border: #d0d7de;  --border-strong: #afb8c1;
  --text:   #1f2328;  --text-dim: #59636e;
  --text-mute: #6e7781;                /* 4.9:1，原 #8b93a1 仅 3.1:1 */
  --accent: #0969da;  --accent-solid: #1f6feb;  --accent-hover: #1a63d8;
  --accent-dim: #1d4ed8;
  --accent-subtle: rgba(9, 105, 218, .09);
  --accent-border: rgba(9, 105, 218, .34);
  --ok: #1a7f37;  --warn: #9a6700;  --err: #cf222e;  --info: #0969da;
  --ok-subtle: rgba(26, 127, 55, .10);  --ok-border: rgba(26, 127, 55, .32);
  --warn-subtle: rgba(154, 103, 0, .10); --warn-border: rgba(154, 103, 0, .32);
  --err-subtle: rgba(207, 34, 46, .10);  --err-border: rgba(207, 34, 46, .32);
  --info-subtle: rgba(9, 105, 218, .09); --info-border: rgba(9, 105, 218, .32);
  --conf-high: #1a7f37;  --conf-mid: #9a6700;  --conf-low: #cf222e;
  --sh-1: 0 1px 2px rgba(31, 35, 40, .10);
  --sh-2: 0 8px 24px rgba(31, 35, 40, .14);
  --sh-3: 0 12px 32px rgba(31, 35, 40, .18);
  --shadow-color: rgb(31 35 40 / .14);
}

/* 跟随系统（未手动设置时生效）*/
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;
    --bg: #ffffff;  --panel: #ffffff;  --panel-2: #f6f8fa;  --panel-3: #ffffff;
    --inset: #f6f8fa;
    --border: #d0d7de;  --border-strong: #afb8c1;
    --text: #1f2328;  --text-dim: #59636e;  --text-mute: #6e7781;
    --accent: #0969da;  --accent-solid: #1f6feb;  --accent-hover: #1a63d8;
    --accent-dim: #1d4ed8;
    --accent-subtle: rgba(9, 105, 218, .09);
    --accent-border: rgba(9, 105, 218, .34);
    --ok: #1a7f37;  --warn: #9a6700;  --err: #cf222e;  --info: #0969da;
    --ok-subtle: rgba(26, 127, 55, .10);  --ok-border: rgba(26, 127, 55, .32);
    --warn-subtle: rgba(154, 103, 0, .10); --warn-border: rgba(154, 103, 0, .32);
    --err-subtle: rgba(207, 34, 46, .10);  --err-border: rgba(207, 34, 46, .32);
    --info-subtle: rgba(9, 105, 218, .09); --info-border: rgba(9, 105, 218, .32);
    --conf-high: #1a7f37;  --conf-mid: #9a6700;  --conf-low: #cf222e;
    --sh-1: 0 1px 2px rgba(31, 35, 40, .10);
    --sh-2: 0 8px 24px rgba(31, 35, 40, .14);
    --sh-3: 0 12px 32px rgba(31, 35, 40, .18);
    --shadow-color: rgb(31 35 40 / .14);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* 焦点环：此前所有 button 都没有，键盘用户无法判断焦点在哪 */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* 尊重系统的动效偏好。加载态不能简单"不动"——那会丢失信息，
   所以用静态图形替代旋转 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .spin { border-top-color: var(--accent) !important; opacity: .85; }
  .dot.busy { animation: none !important; opacity: .6; }
}

/* ---------- 顶栏 ---------- */
/* 两段式：左侧品牌、右侧工具组。工具组内控件共享外框并以细分隔线
   划分——原先三个控件各自独立胶囊，高 30/28px、圆角各异、
   内边距各异，堆在一起松散且不成体系。 */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; height: 56px;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
header .spacer { margin-left: auto; }

/* 品牌区：图标 + 名称 + 版本，纵向基线对齐 */
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { display: flex; flex: none; }
.brand .mark svg { display: block; border-radius: 8px; }
.brand .name { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.brand .name b {
  font-size: 15.5px; font-weight: 700; letter-spacing: .5px;
  color: var(--text); line-height: 1;
}
.brand .name i {
  font-style: normal; font-size: 11.5px; color: var(--text-mute);
  line-height: 1; white-space: nowrap;
}
.brand .ver {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-mute);
  padding: 2px 6px; border-radius: var(--r-full);
  background: var(--panel-2); border: 1px solid var(--border);
  line-height: 1; flex: none;
}

/* 工具组：单一外框承载设备 / 状态 / 主题 */
.tools {
  display: flex; align-items: stretch; flex: none;
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: var(--r-md); overflow: visible;
}
.tsep { width: 1px; background: var(--border); flex: none; }

.tool {
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 11px; flex: none;
  font-size: 12px; font-family: inherit; line-height: 1;
  color: var(--text-dim); background: none; border: none;
  border-radius: 0; cursor: default;
  transition: color var(--dur-1) var(--ease-out), background var(--dur-1) var(--ease-out);
}
/* 圆角只加在外侧两角，与外框贴合；内侧面保持方角，
   靠分隔线划分——逐个控件都做成胶囊会在接缝处露出底色缺口 */
.tools > .tool:first-child { border-radius: var(--r-md) 0 0 var(--r-md); }
.tools > .tool:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; }
.tool.sq { width: 34px; padding: 0; justify-content: center; font-size: 13.5px; cursor: pointer; }
button.tool { cursor: pointer; }
button.tool:hover { color: var(--accent); background: var(--accent-subtle); }
button.tool:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.tool .ic {
  width: 14px; height: 14px; flex: none;
  opacity: .72;
}
.tool .ic.caret { width: 11px; height: 11px; opacity: .5; margin-left: -2px; }
/* 主题图标由 CSS 按当前主题显隐，不再用 JS 改 textContent——
   两个字符图标（☀/☾）字形随系统字体变化，粗细与品牌区的
   矢量图标对不上，且切换时会有一次文本重排的抖动。
   默认（无 data-theme，即跟随系统深色）亮月亮；显式 light 亮太阳。
   两条规则都必须写全：只写 light 那条的话，从 light 切到 dark 时
   太阳不会被隐藏，两个图标会同时出现。 */
/* 显隐规则必须与 .tool .ic 同权重或更高——.tool .ic 里的
   display:block 是 (0,2,0)，若这里的 display:none 只有 (0,1,0)，
   会被前者压住，两个图标就一直同时显示。 */
.tool .ico-moon { display: block; }
.tool .ico-sun { display: none; }
[data-theme="light"] .tool .ico-sun { display: block; }
[data-theme="light"] .tool .ico-moon { display: none; }

/* 状态点：外圈用内阴影，避免撑大控件尺寸引起基线跳动 */
.dot {
  width: 6px; height: 6px; border-radius: 50%; flex: none;
  background: var(--text-mute);
}
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.dot.busy { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* 设备徽标：GPU 生效时点亮，降级到 CPU 时转为中性色。
   颜色全部走 token —— 此前硬编码 #10b981，在亮色近白底上只有
   2.9:1，且与 --ok 不是同一个颜色 */
.tool.dev { font-family: var(--mono); letter-spacing: .2px; }
/* 显卡全名可能长达30+ 字符（「NVIDIA GeForce RTX 4070 Ti SUPER」），
   顶栏是横向 flex，不限制就会把品牌区挤走。这里给出上限并省略，
   完整型号仍在 title 与下拉里可见。 */
#devName {
  max-width: 190px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.tool.dev.gpu {
  color: var(--ok);
  background: var(--ok-subtle);
}
.tool.dev.cpu { color: var(--text-mute); }
.tool.dev.err {
  color: var(--err); background: var(--err-subtle);
}
.tool.dev:hover { border-radius: 0; }
.tool.dev.busy { opacity: .55; pointer-events: none; }

/* 设备下拉：挂在徽标下方，点击外部关闭 */
/* devwrap 是工具组的 flex 子项，stretch 下已与组等高；
   显式声明只为让下拉的 top:100% 有确定的参照 */
.devwrap { position: relative; display: flex; align-self: stretch; }
/* 下拉挂在工具组内部，必须避让工具组自身的边框，
   否则会与外框描边重叠、看起来像多了一条线。
   配色用 --v3-*：这个弹层挂在 v3 样式的顶栏里，用旧 token 会
   与顶栏的 --v3-header-bg 脱节，出现「顶栏浅色、弹层深色」。 */
.devpop {
  position: absolute; top: calc(100% + 7px); right: 0; z-index: 40;
  min-width: 240px; max-width: 340px; padding: 5px; border-radius: 10px;
  background: var(--v3-pop-bg); border: 1px solid var(--v3-pop-border);
  box-shadow: var(--v3-pop-shadow);
}
.devpop button {
  display: flex; align-items: baseline; gap: 8px; width: 100%;
  padding: 8px 10px; font-size: 12.5px; text-align: left;
  border: none; border-radius: 7px; background: transparent;
  color: var(--v3-text); cursor: pointer; font-family: inherit;
}
.devpop button:hover { background: var(--v3-inset); }
.devpop button:disabled { opacity: .38; cursor: not-allowed; }
.devpop button.on { background: color-mix(in srgb, var(--v3-primary) 15%, transparent); }
.devpop button .tag {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  min-width: 34px; color: var(--v3-text);
}
.devpop button.on .tag { color: var(--v3-primary); }
.devpop button .hint {
  margin-left: auto; font-size: 10.5px; color: var(--v3-text-3);
  font-family: var(--mono); text-align: right;
}
.devpop button .why {
  display: block; font-size: 10.5px; color: var(--warn);
  margin-top: 2px; line-height: 1.45; white-space: normal;
}
.devpop .sep { height: 1px; background: var(--v3-border); margin: 4px 6px; }
/* 自动检测落到 CPU 时的原因说明。走提示色而非正文色：
   它是「需要用户做点什么」的信息，不是一句装饰性备注 */
.devpop .note {
  padding: 6px 10px 8px; font-size: 10.5px; color: var(--warn);
  line-height: 1.5; white-space: normal;
}
.devpop .hd {
  padding: 5px 10px 4px; font-size: 10.5px; color: var(--v3-text-3);
  letter-spacing: .4px;
}

/* ---------- 布局 ----------
   上半屏：左「上传 + 配置」／ 右「图文对照」
   下半屏：左「识别记录」／ 右「示例图」
   上下两屏各自独立滚动，页面本身不滚——这样切换内容时，
   上半屏的操作区与对照区始终同屏可见。 */
.wrap {
  max-width: 1680px; margin: 0 auto; padding: 16px 24px 24px;
  display: grid; gap: 16px;
  grid-template-columns: 340px minmax(0, 1fr);
  /* 行高只由视口决定，不掺 min-content。掺过的实测教训：CSS Grid 中
     minmax() 的下限优先级高于上限，视口不够时下限先赢——于是「保底
     639px 不压」的上行在 800px 高的屏上反而把下行挤成0，整页多出一段
     滚动，而真正该保证不消失的「开始识别」按钮又被裁掉。
     纯视口比例则可预期：上行 62%、下行吃掉剩余；左栏内容放不下时
     由 .side 自己的滚动条处理。 */
  grid-template-rows: minmax(0, 62fr) minmax(0, 38fr);
  grid-template-areas:
    "side main"
    "hist samples";
  height: calc(100vh - 56px);
}
.side  { grid-area: side; overflow: hidden; display: flex; flex-direction: column; }
/* 只有参数区可滚。上传区与操作按钮都固定：前者是左栏的第一入口，
   滚走后用户会以为按钮丢了。
   实测 800px 高的屏上参数区需要 579px 而只有 ~230px 可用，
   滚动是必然的——所以必须把「不该滚的」明确排除在外。 */
.side-params { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
/* 内容被裁切时给「下面还有」的暗示。用 scrollable 类由 JS 挂载——
   直接写mask-image 会在内容恰好放得下时也把底部淡掉，
   看起来像渲染缺失。mask 而非 box-shadow：后者跟着内容一起滚走。 */
.side-params.scrollable:not(.at-end) {
  mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent 100%);
}
.side-actions { flex: none; padding-top: 12px; }
.side-actions .btn-line { margin-top: 8px; }
.main  { grid-area: main;   overflow: hidden; }
.hist  { grid-area: hist;   overflow: hidden; }
.samples-wrap { grid-area: samples; overflow: hidden; }

/* 1440 以下左栏收窄：340px 在 1280 屏上占比过高，右侧对照区被挤窄 */
@media (max-width: 1440px) { .wrap { grid-template-columns: 300px minmax(0, 1fr); } }

/* 中屏：两栏改上下堆叠。此时右栏不再需要固定高度，
   交回给页面自然滚动，否则会出现「页内滚动 + 外层滚动」两层滚动条。 */
@media (max-width: 1080px) {
  .wrap {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto auto;
    grid-template-areas: "side" "main" "hist" "samples";
    height: auto;
  }
  .side, .main, .hist, .samples-wrap { overflow: visible; }
  /* 交回页面自然滚动时，height:100% 必须一并解除——父容器此时由内容
     决定高度，100% 会形成「高度依赖高度」的循环，被解析成 auto，
     与 .split 的固定 560px 打架。 */
  .card.fill { height: auto; }
  /* 交回页面自然滚动时，内部滚动容器必须一并解除，
     否则参数区被限高而按钮底栏紧贴，出现「按钮压住参数」的错位。 */
  .side { display: block; }
  .side-params { overflow: visible; display: block; }
  .side-params > .card + .card { margin-top: 12px; }
  .side-actions { padding-top: 12px; }
  /* 图与明细在窄屏改上下排。必须给足高度：此时 .split 的父容器
   由视口比例决定，实测 1440x900 下只有 289px，两行各得 144px，
   图片被压到 159px 宽——比不排版还糟。这里改为固定高度，
   宁可让右栏整体高一点，也要保证图能看清。 */
  .split {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    height: 560px;
  }
  .split .detail { border-left: none; border-top: 1px solid var(--border); }
}

@media (max-width: 720px) {
  .wrap { padding: 12px 12px 20px; gap: 12px; }
  header { padding: 0 12px; gap: 8px; }
  .samples { grid-template-columns: repeat(3, 1fr); }
  /* 窄屏优先保住品牌名与工具组：设备后缀与副标题先让位 */
  .brand .name i { display: none; }
  .brand .ver { display: none; }
}
@media (max-width: 460px) {
  .samples { grid-template-columns: repeat(2, 1fr); }
  /* 极窄屏优先保住「当前跑在 CPU 还是 GPU」这个关键信息。
     用 clip 而非 display:none 隐藏设备后缀——后者会连GPU 字样
     一起藏掉，用户就完全看不出跑在什么设备上了。 */
  .tool.dev #devName { max-width: 42px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-line { flex-wrap: wrap; }
}

/* 卡片在「不滚动的固定高」容器里需要自行管理内部高度 */
.card { display: flex; flex-direction: column; min-height: 0; }
/* 撑满所在 grid 区域。用类而非内联 style：内联样式 specificity 更高，
   响应式断点里没法覆盖，窄屏就会把固定高带进堆叠布局。 */
.card.fill { height: 100%; }
.card.scroll { flex: 1; min-height: 0; }

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.card + .card { margin-top: 16px; }
.card-h {
  display: flex; align-items: center; gap: 8px; flex: none;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-size: 11.5px; font-weight: 600; letter-spacing: .7px;
  text-transform: uppercase; color: var(--text-mute);
}
.card-h .n { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; }
.card-b { padding: 16px; }

/* ---------- 左栏密度 ----------
   左栏要在 800px 高的屏上完整放下「上传 + 全部参数 + 开始识别」，
   实测需 639px，而视口 62% 只给到 427px——按钮会被裁到折叠区外。
   与其让用户去滚左栏，不如把密度收下来：拖放区与表单间距各收一段，
   再省掉一次标题栏的 16px 外边距，合计约 150px。 */
.side .card + .card { margin-top: 12px; }
.side .card-b { padding: 12px 14px; }
.side .drop { padding: 16px 14px; }
.side .drop .ico { font-size: 20px; }
.side .f { margin-bottom: 10px; }
.side .row > .f { margin-bottom: 10px; }
.side .f > label { margin-bottom: 4px; }
.side .btn-line { margin-top: 8px; }
/* 记录区与示例区的可滚动正文 */
.card-body { flex: 1; min-height: 0; overflow: auto; }

/* ---------- 拖放区 + 缩略图预览 ----------
   上传后就地变成缩略图预览，不另开一处展示：用户关心的是
   「我传的是哪张图」，在原地替换比让他去别处找更省心智。
   PDF/Office 没有可预览的首屏，退回文件卡片形态。 */
.drop {
  position: relative; border: 1.5px dashed var(--border);
  border-radius: var(--radius); padding: 24px 16px; text-align: center;
  cursor: pointer; transition: border-color .16s, background .16s;
  background: var(--panel-2);
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-subtle); }

/* 空闲态：图标 + 文案 */
.drop .idle { display: block; }
.drop .ico { font-size: 24px; opacity: .7; }
.drop .t { font-size: 13.5px; font-weight: 500; margin-top: 4px; }
.drop .h { font-size: 11.5px; color: var(--text-mute); margin-top: 2px; }

/* 已选态：图片铺满卡片，下方压一条渐变显示文件名 */
.drop.filled { padding: 0; border-style: solid; border-color: var(--accent-border); }
.drop.filled .idle { display: none; }
.thumb { position: relative; display: block; width: 100%; border-radius: 9px; overflow: hidden; }
.thumb img {
  display: block; width: 100%; height: 132px; object-fit: contain;
  background: var(--inset);
}
.thumb .cap {
  display: flex; align-items: center; gap: 6px; padding: 7px 9px;
  font-size: 11.5px; color: var(--text-dim); background: var(--panel-2);
  border-top: 1px solid var(--border);
}
.thumb .cap .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .cap .sz { margin-left: auto; flex: none; color: var(--text-mute); font-family: var(--mono); }

/* 非图片文件：显示类型徽标而非空白缩略图 */
.thumb .ph {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 132px; background: var(--inset); color: var(--text-mute); font-size: 12.5px;
}
.thumb .ph .ext {
  font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: var(--r-full);
  background: var(--panel-3); color: var(--text-dim); border: 1px solid var(--border);
}
/* 悬浮在缩略图上的「更换」提示，让用户知道还能点 */
.thumb::after {
  content: "点击更换"; position: absolute; inset: auto 0 34px 0; padding: 6px;
  font-size: 11.5px; text-align: center; color: #fff;
  background: rgba(0, 0, 0, .68);
  opacity: 0; transition: opacity var(--dur-1) var(--ease-out);
}
.drop.filled:hover .thumb::after { opacity: 1; }

/* 全页拖放反馈。拖文件进窗口时给出明确落点，
   否则用户不知道左栏那个小框是不是唯一能放的地方 */
body.dragging::after {
  content: ""; position: fixed; inset: 8px; z-index: 80;
  border: 2px dashed var(--accent); border-radius: var(--r-lg);
  background: var(--accent-subtle); pointer-events: none;
}

/* ---------- 表单 ---------- */
.f { margin-bottom: 13px; }
.f:last-child { margin-bottom: 0; }
.f > label { display: block; font-size: 11.5px; color: var(--text-mute); margin-bottom: 5px; }
.row { display: flex; gap: 9px; }
.row > .f { flex: 1; margin-bottom: 13px; }
select, input[type=number] {
  width: 100%; padding: 8px 10px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); color: var(--text); font-family: inherit;
  transition: .14s;
}
select:hover, input[type=number]:hover { border-color: var(--text-mute); }
select:focus, input:focus { outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12.5px; color: var(--text-dim); }
.check input { accent-color: var(--accent); width: 14px; height: 14px; }

button {
  width: 100%; padding: 10px 14px; font-size: 13.5px; font-weight: 600;
  border: none; border-radius: 9px; cursor: pointer;
  /* 必须用 --accent-solid：白字压 --accent(#6f9bff) 只有 3.16:1，
     达不到 WCAG AA 的 4.5:1。压 #2f6ae0 是 4.6:1。 */
  background: var(--accent-solid); color: #fff; font-family: inherit;
  transition: background .14s, transform .1s; display: flex;
  align-items: center; justify-content: center; gap: 7px;
}
button:hover:not(:disabled) { background: var(--accent-hover); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: not-allowed; }
.btn-line { display: flex; gap: 8px; margin-top: 9px; }
.btn-line button {
  flex: 1; padding: 7px 10px; font-size: 12px; font-weight: 500;
  background: var(--panel-2); color: var(--text-dim);
  border: 1px solid var(--border);
}
.btn-line button:hover:not(:disabled) {
  background: var(--panel); color: var(--accent); border-color: var(--accent);
}

/* ---------- 示例图 ---------- */
/* 位于右下角，宽度约为主区的 1/4，网格须比原来更密。
   object-fit 用 contain：票据类图片四边留白，
   cover 会把文字裁掉，用户点进去发现「识别不全」其实是缩略图的问题 */
.samples { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
@media (max-width: 1440px) { .samples { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 1080px) { .samples { grid-template-columns: repeat(8, 1fr); } }
@media (max-width: 720px) { .samples { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 460px) { .samples { grid-template-columns: repeat(3, 1fr); } }
.samples figure {
  position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-sm); overflow: hidden;
  cursor: pointer; border: 1.5px solid transparent; transition: .14s; background: var(--panel-2);
}
.samples img { width: 100%; height: 100%; object-fit: contain; display: block; }
.samples figure:hover { border-color: var(--accent); transform: translateY(-1px); }
.samples figure.on { border-color: var(--accent); }
.samples figcaption {
  position: absolute; inset: auto 0 0 0; padding: 10px 3px 2px;
  font-size: 9px; text-align: center; color: #fff; line-height: 1.25;
  background: linear-gradient(transparent, rgba(0, 0, 0, .85));
}

/* ---------- 页签（识别记录区）---------- */
.tabs {
  display: flex; gap: 2px; padding: 0 12px;
  border-bottom: 1px solid var(--border); background: var(--panel); flex: none;
}
.tabs button {
  width: auto; flex: none; padding: 11px 14px; font-size: 13px; font-weight: 500;
  background: none; color: var(--text-mute); border: none; border-radius: 0;
  border-bottom: 2px solid transparent; position: relative;
}
.tabs button:hover { background: none; color: var(--text-dim); }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .badge {
  margin-left: 5px; font-size: 10.5px; font-family: var(--mono);
  padding: 1px 5px; border-radius: 10px;
  background: var(--panel-2); color: var(--text-mute);
}
.tabs button.on .badge { background: var(--accent-subtle); color: var(--accent); }
.pane { display: none; position: relative; }
.pane.on { display: block; }
/* 记录区内的面板需自己撑满并滚动 */
.tabs-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tabs-body .pane.on { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* 历史记录列表 */
.hist-list { padding: 8px; }
.hist-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border-radius: var(--r-sm); cursor: pointer;
  border: 1px solid transparent; background: transparent; text-align: left;
  color: var(--text); font-family: inherit;
}
.hist-item:hover { background: var(--panel-2); }
.hist-item.on { background: var(--accent-subtle); border-color: var(--accent-border); }
.hist-item .nm {
  flex: 1; min-width: 0; font-size: 12.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hist-item .meta {
  font-family: var(--mono); font-size: 11px; color: var(--text-mute); flex: none;
}
.hist-item .del {
  width: 22px; height: 22px; padding: 0; flex: none; border: none;
  background: transparent; color: var(--text-mute); opacity: 0; font-size: 12px;
}
.hist-item:hover .del { opacity: .7; }
.hist-item .del:hover { background: var(--err-subtle); color: var(--err); }
.hist-empty { padding: 28px 16px; text-align: center; color: var(--text-mute); font-size: 12.5px; }

/* ---------- 文本区 ---------- */
/* 位于「不滚动的固定高」容器内，必须自己滚动而不是撑高页面。
   min-height 用 0 而非固定值：短结果时贴合内容，长结果时由父级滚动。 */
.out {
  flex: 1; min-height: 0; overflow: auto; margin: 0;
  padding: 16px 18px; font-size: 13.5px;
  font-family: var(--mono); line-height: 1.8; color: var(--text);
  background: transparent; border: none; outline: none;
  white-space: pre-wrap; word-break: break-word;
  user-select: text; -webkit-user-select: text; cursor: text;
}
.out:empty::before { content: attr(data-ph); color: var(--text-mute); }

/* 只读文本区的悬浮操作条。触屏没有 hover，必须常驻可见——
   否则手机上根本找不到复制按钮 */
.out-bar {
  position: absolute; top: 8px; right: 12px; display: flex; gap: 6px;
  opacity: 0; transition: opacity var(--dur-2) var(--ease-out); z-index: 3;
}
.pane:hover .out-bar, .out-bar:focus-within { opacity: 1; }
@media (hover: none) { .out-bar { opacity: 1; } }
.out-bar button {
  padding: 4px 10px; font-size: 11.5px; border-radius: 7px;
  background: var(--panel); color: var(--text-dim);
  border: 1px solid var(--border); backdrop-filter: blur(6px);
}
.out-bar button:hover { color: var(--accent); border-color: var(--accent); }
.out-bar button.ok { color: var(--ok); border-color: var(--ok-border); }

/* ---------- 图文对照 ---------- */
/* 右栏是「图 + 明细」的左右结构。用户要的是逐行核对：看着图上的框、
   对着右侧的文字与置信度。上下排会让视线反复上下跳，而且图片区
   一被压到只剩顶部一条就完全无法定位。 */
.viewer-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2);
}
.viewer-bar .spacer { margin-left: auto; }
.viewer-bar .check { color: var(--text-dim); white-space: nowrap; }
.zoom { display: flex; gap: 3px; }
.zoom button {
  width: 28px; height: 28px; padding: 0; border-radius: 6px; font-size: 14px;
  background: var(--panel); color: var(--text-dim); border: 1px solid var(--border);
}
.zoom button:hover:not(:disabled) { background: var(--panel-2); color: var(--accent); }
#zRst { width: auto; padding: 0 9px; font-size: 11.5px; }

/* 步进器：页数多时用它，页数少时用 pagepick 按钮列。
   64 页全列出来会把工具栏撑到换行，反而更难定位当前页。 */
.stepper {
  display: flex; align-items: center; gap: 2px; padding: 2px;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--panel);
}
.stepper button {
  width: 24px; height: 24px; padding: 0; border: none;
  background: transparent; color: var(--text-dim); font-size: 15px;
  border-radius: 4px;
}
.stepper button:hover:not(:disabled) { background: var(--panel-2); color: var(--accent); }
.pglabel { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); padding: 0 4px; }
.toggles { display: flex; gap: 16px; flex-wrap: wrap; }

/* 图 + 明细并排，各占一半高度、各自独立滚动。
   minmax(0, 1fr) 的 0 不能省：默认 min-height:auto 会让内容顶开容器，
   图片区随即把整页撑出滚动条。 */
.split {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 40%);
}

/* 图片舞台：固定用contain 语义——整幅图完整可见，不裁切。
   图片等比缩放到「刚好放进舞台」，由 fitStage() 算出 zoom。 */
.stage {
  position: relative; overflow: auto; min-height: 0;
  background: repeating-conic-gradient(var(--panel-2) 0% 25%, var(--panel) 0% 50%) 50% / 18px 18px;
}
/* viewer 的布局尺寸 = 缩放后尺寸（由 applyZoom 写入），
   内部 img / canvas 恒为原始尺寸并各自 transform 缩放。
   transform-origin 统一 0 0，保证两者缩放原点一致、框与图不错位。 */
.viewer {
  position: relative; display: block; margin: 8px auto;
  overflow: hidden;
}
.viewer img {
  display: block; max-width: none;
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
}
.viewer canvas {
  position: absolute; top: 0; left: 0; pointer-events: none;
  transform-origin: 0 0;
}

/* 明细：固定列宽 + 独立滚动。图区与明细区互不抢空间，
   点某行高亮时图上对应框的变化即刻可见。 */
.detail { min-height: 0; overflow: auto; border-left: 1px solid var(--border); }
.detail thead th { padding: 7px 12px; }
.detail tbody td { padding: 6px 12px; }

.hover-tip {
  position: fixed; z-index: 50; max-width: 300px; padding: 7px 10px;
  font-size: 12px; font-family: var(--mono); line-height: 1.5;
  background: var(--panel-3); color: var(--text);
  border: 1px solid var(--accent-border); border-radius: var(--r-sm);
  box-shadow: var(--sh-2); pointer-events: none;
  display: none; white-space: pre-wrap;
}

/* ---------- 统计条 ---------- */
/* 布局用 grid 而非 flex。
   flex + wrap 的断点由像素余量随机决定，实测 1280 宽下会把「耗时」
   孤零零甩到第二行，并在其后留下两个孤立的分隔圆点——::after 落在
   换行处就成了无主的记号。grid 用固定列数表达「这 6 项是一组」，
   宽度不够时整组一起换行，断点稳定、不留残迹。
   auto-fit + minmax 让各列按内容分配宽度，标签与数值紧邻，
   不会出现「后端 ······ v6 small」这种被摊开的间距。 */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, max-content));
  gap: 0; border-bottom: 1px solid var(--border);
}
.stats div:not(.srow) {
  display: flex; align-items: baseline; gap: 7px;
  padding: 7px 0 7px 13px;
  border-left: 1px solid var(--border);
}
/* 首格去掉左边框：整条统计条的最左侧不该有一道竖线，
   它不分隔任何东西，只是让内容整体右移了一个缩进。 */
.stats div:first-child:not(.srow) {
  border-left: none; padding-left: 0;
}
/* 每格左侧留一截缩进 + 竖线作为分隔。
   不用 ::after 画圆点：它在 flex 换行后会落在断点处变成无主记号
   （实测 1280 下「耗时」被甩到第二行，身后跟着两个孤立圆点）。
   换行后新行首格也会带竖线，纯 CSS 判断不了是否行首；
   好在竖线语义是「这里起一格」，行首多一道不算错，
   比无主的分隔记号干净。 */
.stats .k {
  font-size: 10.5px; color: var(--text-mute); flex: none;
  text-transform: uppercase; letter-spacing: .5px; white-space: nowrap;
}
.stats .v { font-size: 14px; font-weight: 650; font-family: var(--mono); white-space: nowrap; }
.stats .v.hl { color: var(--accent); }

/* 耗时明细：跨满所有列另起一行，视觉上从属于上一行的核心指标。
   grid-column: 1 / -1 让它的换行与列数无关，
   不会像 flex 那样出现 6+2 / 7+1 这类不齐的断法。 */
.stats .srow {
  grid-column: 1 / -1;
  display: flex; gap: 14px; padding: 0 0 7px;
}
.stats .srow span { display: flex; align-items: baseline; gap: 5px; }
.stats .srow i {
  font-style: normal; font-size: 10.5px; color: var(--text-mute);
  text-transform: uppercase; letter-spacing: .5px;
}
.stats .srow b {
  font-family: var(--mono); font-size: 11.5px;
  font-weight: 500; color: var(--text-dim);
}

/* ---------- 表格 ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 1;
  text-align: left; padding: 9px 16px; font-size: 11px; font-weight: 600;
  color: var(--text-mute); background: var(--panel-2);
  border-bottom: 1px solid var(--border); letter-spacing: .4px;
  /* 表头不许折行。列宽由内联 style 给定（40/74/44px 都小于表头
     文字本身需要），一旦放不下就会把「角度」压成竖排单字，
     高度被撑高、整张表跟着歪。宁可让列宽略溢出也不要竖排。 */
  white-space: nowrap;
}
tbody td { padding: 8px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr { cursor: pointer; transition: .1s; }
tbody tr:hover { background: var(--panel-2); }
tbody tr.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
td.n { font-family: var(--mono); font-size: 11.5px; color: var(--text-mute); width: 1%; white-space: nowrap; }
.bar { display: flex; align-items: center; gap: 8px; }
.bar .track { flex: 1; height: 4px; border-radius: 2px; background: var(--border); min-width: 40px; max-width: 60px; }
.bar .fill { height: 100%; border-radius: 2px; background: var(--ok); }
.bar.lo .fill { background: var(--err); }
.bar .pc { font-family: var(--mono); font-size: 11.5px; width: 40px; text-align: right; flex: none; }

/* ---------- 提示条 ---------- */
/* 改为右下角浮层 toast。原先是嵌在卡片里的横幅，会把下方的页签和
   统计条整体往下推——识别成功这种「无需用户处理」的信息也占据版面，
   显得吵。浮层不占布局，且天然支持多条堆叠。 */
.toasts {
  position: fixed; right: 18px; bottom: 18px; z-index: 90;
  display: flex; flex-direction: column; gap: 8px;
  max-width: min(380px, calc(100vw - 36px)); pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 11px 13px; border-radius: var(--r-md); font-size: 12.5px;
  line-height: 1.55; pointer-events: auto;
  background: var(--panel-3); color: var(--text);
  border: 1px solid var(--border-strong);
  box-shadow: var(--sh-2); font-family: var(--font-ui);
  animation: toast-in var(--dur-2) var(--ease-out);
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px) scale(.97); }
  to   { opacity: 1; transform: none; }
}
.toast.out { animation: toast-out var(--dur-1) var(--ease-out) forwards; }
@keyframes toast-out {
  to { opacity: 0; transform: translateX(16px); }
}
.toast .ico { font-size: 13px; line-height: 1.45; flex: none; }
.toast.err  { border-color: var(--err-border);  background: var(--err-subtle);  color: var(--err); }
.toast.warn { border-color: var(--warn-border); background: var(--warn-subtle); color: var(--warn); }
.toast.ok   { border-color: var(--ok-border);   background: var(--ok-subtle);   color: var(--ok); }
.toast .x {
  margin-left: auto; cursor: pointer; opacity: .55; flex: none;
  background: none; border: none; padding: 0 2px; width: auto;
  color: inherit; font-size: 12px; line-height: 1.45;
}
.toast .x:hover { opacity: 1; }
.toast .x:focus-visible { outline: 2px solid currentColor; }
.hide { display: none !important; }

.empty { padding: 90px 24px; text-align: center; color: var(--text-mute); }
.empty .ico { font-size: 34px; opacity: .35; }
.empty .t { font-size: 13.5px; margin-top: 8px; }
.empty .h { font-size: 12px; margin-top: 3px; }
.norow { text-align: center; padding: 40px; color: var(--text-mute); }

/* 只给读屏用的文本：让「结果视图」这类标题有语义，
   但不在视觉上占位 */
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.spin {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.28); border-top-color: #fff;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }

/* ============================================================
   NOOCR UI Refresh
   仅覆盖视觉/布局样式，不修改任何 DOM id、name、事件、接口或业务逻辑。
   ============================================================ */

:root {
  --bg: #0b0f16;
  --panel: #111722;
  --panel-2: #151d29;
  --panel-3: #1b2533;
  --inset: #080c12;

  --border: #253043;
  --border-strong: #344158;
  --text: #edf3fb;
  --text-dim: #aab6c7;
  --text-mute: #718096;

  --accent: #78a9ff;
  --accent-solid: #3b82f6;
  --accent-hover: #4f8ff7;
  --accent-dim: #2563eb;
  --accent-subtle: rgba(96, 145, 255, .105);
  --accent-border: rgba(110, 157, 255, .30);

  --ok: #43d17a;
  --ok-subtle: rgba(67, 209, 122, .10);
  --ok-border: rgba(67, 209, 122, .28);
  --warn: #e6ad4d;
  --warn-subtle: rgba(230, 173, 77, .10);
  --warn-border: rgba(230, 173, 77, .28);
  --err: #ff6b67;
  --err-subtle: rgba(255, 107, 103, .10);
  --err-border: rgba(255, 107, 103, .28);
  --info: #62a8ff;
  --info-subtle: rgba(98, 168, 255, .10);
  --info-border: rgba(98, 168, 255, .28);

  --sh-1: 0 1px 2px rgba(0,0,0,.22);
  --sh-2: 0 10px 30px rgba(0,0,0,.25);
  --sh-3: 0 20px 55px rgba(0,0,0,.34);

  --radius: 13px;
  --r-sm: 7px;
  --r-md: 10px;
  --r-lg: 13px;
}

/* ---------- 页面背景 ---------- */
body {
  background:
    radial-gradient(900px 420px at 48% -120px, rgba(58, 112, 210, .12), transparent 70%),
    radial-gradient(600px 380px at 100% 100%, rgba(50, 92, 180, .055), transparent 72%),
    var(--bg);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background-image:
    linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.5), transparent 82%);
}

/* ---------- 顶栏 ---------- */
header {
  height: 62px;
  padding: 0 26px;
  background: rgba(13, 18, 27, .82);
  border-bottom: 1px solid rgba(112, 133, 165, .18);
  box-shadow: 0 1px 0 rgba(255,255,255,.025);
}

.brand .mark svg {
  border-radius: 9px;
  filter: drop-shadow(0 4px 10px rgba(44, 108, 235, .20));
}

.brand .name b {
  font-size: 16px;
  letter-spacing: .7px;
}

.brand .name i {
  font-size: 11px;
  color: #8190a5;
}

.brand .ver {
  background: rgba(255,255,255,.035);
  border-color: rgba(255,255,255,.09);
  color: #77859a;
}

.tools {
  background: rgba(255,255,255,.035);
  border-color: rgba(119, 143, 180, .20);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
}

.tool {
  height: 34px;
  padding: 0 12px;
}

.tool:hover {
  background: rgba(112, 154, 235, .09);
}

/* 设备下拉的第二处定义：加毛玻璃与更深的投影。
   配色走 --v3-* 而不是写死 rgba(18,25,37,.97)——那条硬编码不
   分主题，浅色主题下弹出来是一块深色板，文字（--text 是浅色
   主题的深灰）压上去几乎看不见。 */
.devpop {
  margin-top: 1px;
  padding: 6px;
  background: var(--v3-pop-bg);
  border-color: var(--v3-pop-border);
  box-shadow: var(--v3-pop-shadow);
  backdrop-filter: blur(18px);
}

/* ---------- 主体：更明确的三层工作台结构 ---------- */
.wrap {
  max-width: 1840px;
  padding: 18px 24px 24px;
  gap: 14px;
  grid-template-columns: 330px minmax(0, 1fr);
  grid-template-rows: minmax(0, 64fr) minmax(0, 36fr);
  height: calc(100vh - 62px);
}

/* ---------- 卡片 ---------- */
.card {
  position: relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), transparent 28%),
    var(--panel);
  border: 1px solid rgba(117, 143, 181, .18);
  border-radius: var(--radius);
  box-shadow: var(--sh-1);
}

.card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  border-radius: var(--radius) var(--radius) 0 0;
  background: linear-gradient(90deg, transparent, rgba(126, 164, 229, .22), transparent);
  pointer-events: none;
}

.card-h {
  min-height: 43px;
  padding: 11px 15px;
  background: rgba(255,255,255,.012);
  border-bottom-color: rgba(117, 143, 181, .13);
  font-size: 10.5px;
  letter-spacing: .9px;
  color: #8290a4;
}

.card-h::before {
  content: "";
  width: 5px;
  height: 5px;
  flex: none;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(120,169,255,.09);
}

.card-h .n {
  color: #66758b;
}

.card-b {
  padding: 14px;
}

/* ---------- 左侧上传/参数区 ---------- */
.side .card {
  box-shadow: 0 5px 18px rgba(0,0,0,.12);
}

.side .card:first-child {
  border-color: rgba(110, 157, 235, .22);
}

.side .card:first-child .card-h {
  color: #9aabc1;
}

.side .drop {
  min-height: 142px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  border: 1px dashed rgba(118, 145, 184, .30);
  border-radius: 11px;
  background:
    radial-gradient(circle at 50% 10%, rgba(86, 137, 225, .09), transparent 60%),
    rgba(255,255,255,.018);
}

.side .drop:hover,
.side .drop.over {
  border-color: rgba(111, 164, 255, .75);
  background:
    radial-gradient(circle at 50% 10%, rgba(86, 137, 225, .15), transparent 62%),
    rgba(91, 137, 220, .055);
  box-shadow: inset 0 0 0 1px rgba(91,137,220,.07);
}

.side .drop .ico {
  width: 42px;
  height: 42px;
  margin: 0 auto 8px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-size: 20px;
  background: rgba(91, 137, 220, .10);
  border: 1px solid rgba(110, 157, 235, .17);
  opacity: .9;
}

.side .drop .t {
  font-size: 13px;
  font-weight: 600;
  color: #d6e0ed;
}

.side .drop .h {
  color: #74839a;
  font-size: 11px;
  margin-top: 4px;
}

.side-params {
  padding-right: 3px;
  scrollbar-gutter: stable;
}

.side .card + .card {
  margin-top: 10px;
}

.side .card-b {
  padding: 13px 14px;
}

/* 参数分组视觉层级 */
.side-params .f > label {
  color: #7f8da2;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .2px;
}

.side-params .row {
  gap: 8px;
}

/* ---------- 所有表单控件 ---------- */
select,
input[type=number] {
  min-height: 36px;
  padding: 8px 34px 8px 11px;
  border-radius: 9px;
  border: 1px solid rgba(115, 139, 174, .24);
  background-color: rgba(255,255,255,.035);
  color: #dfe7f2;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.018);
  transition:
    border-color .16s ease,
    box-shadow .16s ease,
    background-color .16s ease,
    transform .16s ease;
}

select {
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  background-image:
    linear-gradient(45deg, transparent 50%, #8291a8 50%),
    linear-gradient(135deg, #8291a8 50%, transparent 50%);
  background-position:
    calc(100% - 15px) 15px,
    calc(100% - 10px) 15px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}

select:hover,
input[type=number]:hover {
  background-color: rgba(255,255,255,.052);
  border-color: rgba(128, 153, 190, .42);
}

select:focus,
input:focus {
  border-color: rgba(108, 161, 255, .82);
  box-shadow:
    0 0 0 3px rgba(77, 137, 239, .13),
    inset 0 1px 0 rgba(255,255,255,.025);
}

select option {
  background: #151d29;
  color: #e8eef7;
}

input[type=number] {
  padding-right: 11px;
}

input[type=range] {
  height: 5px;
  cursor: pointer;
}

.check {
  color: #9caabd;
}

.check input {
  accent-color: #5f98f5;
}

/* ---------- 按钮 ---------- */
button {
  min-height: 38px;
  border-radius: 9px;
  background: linear-gradient(180deg, #4b91f7, #3479df);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    0 5px 14px rgba(34, 91, 176, .18);
}

button:hover:not(:disabled) {
  background: linear-gradient(180deg, #5b9bfa, #3c82e8);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    0 7px 18px rgba(34, 91, 176, .24);
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

.btn-line button {
  min-height: 34px;
  border-radius: 8px;
  background: rgba(255,255,255,.035);
  border-color: rgba(115, 139, 174, .20);
}

.btn-line button:hover:not(:disabled) {
  background: rgba(96, 145, 225, .08);
  border-color: rgba(105, 157, 240, .42);
}

/* ---------- 右上图文对照 ---------- */
.main .card {
  box-shadow: 0 7px 24px rgba(0,0,0,.16);
}

.viewer-bar {
  min-height: 47px;
  padding: 8px 12px;
  background: rgba(255,255,255,.018);
  border-bottom-color: rgba(117, 143, 181, .13);
}

.viewer-bar .check {
  font-size: 11.5px;
}

.zoom button,
.stepper button {
  min-height: 28px;
  box-shadow: none;
  background: rgba(255,255,255,.035);
  border-color: rgba(115, 139, 174, .20);
}

.zoom button:hover:not(:disabled),
.stepper button:hover:not(:disabled) {
  background: rgba(96,145,225,.10);
}

#zRst {
  min-height: 28px;
}

.stats {
  min-height: 42px;
  background: rgba(255,255,255,.012);
  border-bottom-color: rgba(117, 143, 181, .13);
}

.stats div:not(.srow) {
  padding-top: 6px;
  padding-bottom: 6px;
}

.stats .v {
  font-size: 13.5px;
}

.stage {
  background:
    radial-gradient(circle at center, rgba(91, 127, 184, .055), transparent 55%),
    repeating-conic-gradient(#101722 0% 25%, #0d141e 0% 50%) 50% / 18px 18px;
}

.viewer {
  margin: 12px auto;
  border-radius: 6px;
  box-shadow: 0 12px 32px rgba(0,0,0,.28);
}

.detail {
  border-left-color: rgba(117, 143, 181, .16);
  background: rgba(255,255,255,.008);
}

.detail thead th {
  background: rgba(23, 31, 44, .96);
  color: #7f8ea4;
  border-bottom-color: rgba(117, 143, 181, .14);
}

.detail tbody td {
  border-bottom-color: rgba(117, 143, 181, .095);
}

.detail tbody tr:hover {
  background: rgba(100, 145, 225, .055);
}

.detail tbody tr.on {

  box-shadow: inset 2px 0 0 #6098ee;
}

/* ---------- 左下：识别记录 ---------- */
.hist .card {
  box-shadow: 0 7px 22px rgba(0,0,0,.13);
}

.tabs {
  min-height: 43px;
  padding: 0 10px;
  gap: 3px;
  background: rgba(255,255,255,.012);
  border-bottom-color: rgba(117, 143, 181, .13);
}

.tabs button {
  min-height: 42px;
  padding: 8px 13px;
  border-radius: 7px 7px 0 0;
  color: #75849a;
}

.tabs button:hover {
  background: rgba(255,255,255,.025);
  color: #aab8ca;
}

.tabs button.on {
  color: #a9c8ff;
  background: rgba(91, 143, 236, .075);
  border-bottom-color: #6098ee;
}

.tabs .badge {
  background: rgba(255,255,255,.055);
  color: #748399;
}

.tabs button.on .badge {
  background: rgba(93, 148, 239, .13);
  color: #83adf7;
}

.hist-list {
  padding: 9px;
}

.hist-item {
  min-height: 37px;
  margin-bottom: 3px;
  padding: 8px 10px;
  border-radius: 8px;
  border-color: transparent;
}

.hist-item:hover {
  background: var(--v3-hover);
}

.hist-item.on {
  background: var(--v3-sel-bg);
  border-color: var(--v3-primary-border);
  box-shadow: inset 2px 0 0 var(--v3-primary);
}

.hist-item .nm {
  color: var(--v3-text);
}

.hist-item .meta {
  color: var(--v3-text-2);
}

/* 文本/Markdown 结果区。原先这几条写死了深色底与浅色字，
   而浅色主题没有对应覆盖——识别完切到浅色，导出栏按钮会变成
   一块深色板浮在白底上。统一走 v3 变量。 */
.out {
  padding: 14px 16px;
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--v3-text);
}

.out-bar button {
  min-height: 28px;
  background: var(--v3-panel);
  color: var(--v3-text-dim);
}

/* ---------- 右下：示例图 ---------- */
.samples-wrap .card {
  box-shadow: 0 7px 22px rgba(0,0,0,.13);
}

.samples-wrap .card-h {
  min-height: 43px;
}

.samples-wrap .card-body {
  padding: 10px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.008), transparent),
    rgba(255,255,255,.005);
}

.samples {
  gap: 8px;
  grid-template-columns: repeat(6, minmax(0, 1fr));
}

.samples figure {
  aspect-ratio: 1.55 / 1;
  border-radius: 9px;
  border: 1px solid rgba(115, 139, 174, .16);
  background: #0d141e;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
  transition:
    transform .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}

.samples figure:hover {
  transform: translateY(-2px);
  border-color: rgba(105, 157, 240, .58);
  box-shadow: 0 7px 18px rgba(0,0,0,.24);
}

.samples figure.on {
  border-color: #6098ee;
  box-shadow:
    0 0 0 2px rgba(96,152,238,.10),
    0 7px 18px rgba(0,0,0,.20);
}

.samples figcaption {
  padding: 13px 5px 5px;
  font-size: 9.5px;
  background: linear-gradient(transparent, rgba(4,8,14,.92));
}

/* ---------- 空状态 ---------- */
.empty {
  padding: 70px 24px;
}

.empty .ico {
  width: 54px;
  height: 54px;
  margin: 0 auto;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: rgba(91, 137, 220, .07);
  border: 1px solid rgba(110, 157, 235, .11);
  font-size: 25px;
  opacity: .65;
}

.empty .t {
  margin-top: 12px;
  color: #a0aec0;
}

.empty .h {
  color: #64748a;
}

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(107, 128, 157, .28);
  border-radius: 99px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(126, 151, 186, .48);
}

/* ---------- Toast ---------- */
.toasts {
  right: 20px;
  bottom: 20px;
}

.toast {
  background: rgba(24, 32, 45, .94);
  border-color: rgba(126, 151, 190, .26);
  box-shadow: 0 15px 38px rgba(0,0,0,.32);
  backdrop-filter: blur(14px);
}

/* ---------- 响应式 ---------- */
@media (max-width: 1440px) {
  .wrap {
    grid-template-columns: 305px minmax(0, 1fr);
  }

  .samples {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}

@media (max-width: 1080px) {
  .wrap {
    padding: 14px;
    gap: 12px;
  }

  .samples {
    grid-template-columns: repeat(8, minmax(0, 1fr));
  }

  .main .card {
    min-height: 720px;
  }
}

@media (max-width: 720px) {
  header {
    padding: 0 13px;
  }

  .wrap {
    padding: 10px;
  }

  .samples {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}

@media (max-width: 460px) {
  .samples {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

  --border-strong: #c4cfdd;
  --text: #1e2937;
  --text-dim: #5c6b7e;
  --text-mute: #748196;
  --accent: #2563d9;
  --accent-solid: #2563eb;
  --accent-hover: #1d5fd4;
  --accent-subtle: rgba(37,99,235,.07);
  --accent-border: rgba(37,99,235,.25);
}

:root[data-theme="light"] body {

:root[data-theme="light"] header {

}

:root[data-theme="light"] .card {

:root[data-theme="light"] select,
:root[data-theme="light"] input[type=number] {

}

:root[data-theme="light"] select option {

    radial-gradient(circle at center, rgba(90,125,180,.035), transparent 55%),

/* =========================================================
   v2 左栏参数区重排
   目标：桌面端一次性展示全部识别参数，取消参数区内部滚动；
   不修改 DOM、ID、接口、事件绑定和业务逻辑。
   ========================================================= */

.side {
  /* 左栏内部改成明确的三段式：上传 / 参数 / 操作 */
  display: grid !important;
  grid-template-rows: auto auto auto !important;
  align-content: start !important;
  gap: 10px !important;
  overflow: hidden !important;
}

.side > .card:first-child {
  margin: 0 !important;
}

/* 上传卡：明显压缩高度，给参数区让空间 */
.side > .card:first-child .card-b {
  padding: 10px 12px !important;
}

.side .drop {
  min-height: 0 !important;
  height: 154px !important;
  padding: 10px !important;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 已上传图片：缩略图 + 文件信息做成紧凑卡片 */
.side .drop.filled .thumb {
  height: 132px !important;
  border-radius: 9px;
}

.side .drop.filled .thumb img {
  height: 96px !important;
  object-fit: contain;
}

.side .drop.filled .thumb .cap {
  height: 36px;
  box-sizing: border-box;
  padding: 7px 9px !important;
}

.side .drop.filled .thumb::after {
  bottom: 36px !important;
}

/* 未上传时也不要让上传框过高 */
.side .drop:not(.filled) .idle {
  transform: translateY(-1px);
}

/* 参数区：不再滚动 */
.side-params {
  min-height: 0 !important;
  height: auto !important;
  overflow: visible !important;
  padding: 0 !important;
  scrollbar-gutter: auto !important;
}

.side-params.scrollable:not(.at-end) {
  mask-image: none !important;
  -webkit-mask-image: none !important;
}

.side-params > .card {
  margin: 0 !important;
}

.side-params .card-h {
  height: 40px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  padding: 0 14px !important;
}

.side-params .card-b {
  padding: 11px 13px 12px !important;
}

/* 参数整体采用紧凑的网格：
   后端占满一行；DPI / 页数一行；Batch / 开关一行 */
.side-params .card-b {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
  column-gap: 9px !important;
  row-gap: 9px !important;
  align-items: end;
}

.side-params .card-b > .f:first-child {
  grid-column: 1 / -1;
}

.side-params .card-b > .row {
  display: contents !important;
}

.side-params .card-b > .row > .f {
  margin: 0 !important;
}

.side-params .card-b > .f:not(:first-child) {
  margin: 0 !important;
}

/* batch 独占左列，开关区放右列 */
.side-params .card-b > .f:nth-last-child(2) {
  grid-column: 1;
}

.side-params .card-b > .toggles {
  grid-column: 2;
  min-height: 36px;
  margin: 0 !important;
}

/* 标签更清晰，减少上下空白 */
.side-params .f > label {
  margin: 0 0 5px !important;
  font-size: 10.5px !important;
  line-height: 1.15;
  color: #74839a !important;
}

.side-params select,
.side-params input[type="number"] {
  width: 100% !important;
  box-sizing: border-box;
  min-height: 36px !important;
  height: 36px !important;
}

/* 两个开关做成一个轻量设置面板 */
.side-params .toggles {
  display: flex !important;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 0 9px;
  box-sizing: border-box;
  border: 1px solid rgba(115, 139, 174, .20);
  border-radius: 9px;
  background: rgba(115, 139, 174, .045);
}

.side-params .toggles .check {
  gap: 5px;
  font-size: 10.5px !important;
  color: #7c8ca2;
}

.side-params .toggles .check input {
  width: 13px;
  height: 13px;
  margin: 0;
}

/* 操作区紧凑、固定，不挤压参数 */
.side-actions {
  padding: 0 !important;
  margin: 0 !important;
}

.side-actions #run {
  width: 100%;
  height: 40px !important;
  min-height: 40px !important;
  border-radius: 10px !important;
  font-size: 13px !important;
  font-weight: 650;
}

.side-actions .btn-line {
  display: grid !important;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  margin-top: 7px !important;
}

.side-actions .btn-line button {
  min-width: 0;
  height: 34px !important;
  padding: 0 6px !important;
  border-radius: 8px !important;
  font-size: 10.5px !important;
}

/* 左栏卡片的间距统一，避免现在参数卡和上传卡像两个不同系统 */
.side > .card,
.side-params > .card,
.side-actions {
  width: 100%;
  box-sizing: border-box;
}

/* ---------------------------------------------------------
   进一步压缩：常见 900px 高以下的桌面屏
   --------------------------------------------------------- */
@media (max-height: 900px) and (min-width: 901px) {
  .side {
    gap: 8px !important;
  }

  .side .drop {
    height: 142px !important;
  }

  .side .drop.filled .thumb {
    height: 120px !important;
  }

  .side .drop.filled .thumb img {
    height: 86px !important;
  }

  .side .drop.filled .thumb .cap {
    height: 34px;
  }

  .side-params .card-h {
    height: 38px;
  }

  .side-params .card-b {
    padding: 9px 12px 10px !important;
    row-gap: 7px !important;
  }

  .side-params .f > label {
    margin-bottom: 4px !important;
  }

  .side-params select,
  .side-params input[type="number"] {
    min-height: 34px !important;
    height: 34px !important;
  }

  .side-params .toggles {
    min-height: 34px;
  }

  .side-actions #run {
    height: 38px !important;
    min-height: 38px !important;
  }

  .side-actions .btn-line button {
    height: 32px !important;
  }
}

/* ---------------------------------------------------------
   更窄桌面端：参数仍然保持“一次展示”，但改为单列，
   避免 300px 左栏出现文字拥挤。
   --------------------------------------------------------- */
@media (min-width: 901px) and (max-width: 1180px) {
  .side-params .card-b {
    grid-template-columns: 1fr !important;
  }

  .side-params .card-b > .f:first-child,
  .side-params .card-b > .f:nth-last-child(2),
  .side-params .card-b > .toggles {
    grid-column: 1 !important;
  }

  .side-params .toggles {
    justify-content: flex-start;
    gap: 18px;
  }
}

/* ---------------------------------------------------------
   手机/窄屏沿用原有纵向布局逻辑
   --------------------------------------------------------- */
@media (max-width: 900px) {
  .side {
    display: block !important;
  }

  .side > .card:first-child,
  .side-params,
  .side-actions {
    margin-bottom: 10px !important;
  }

  .side-params .card-b {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
  }

  .side-params .card-b > .f:first-child {
    grid-column: 1 / -1;
  }

  .side-params .card-b > .f:nth-last-child(2) {
    grid-column: 1;
  }

  .side-params .card-b > .toggles {
    grid-column: 2;
  }
}


/* ============================================================
   NOOCR UI v3 — Premium OCR Workbench
   仅视觉层重构：不修改 DOM、ID、接口、事件和业务逻辑。

   配色全部走 --v3-* 变量：**这一段原本把浅色值硬编码在各条
   规则里再用 !important 压住旧主题**，结果是 data-theme=dark
   时整页仍是浅色底、左上角白字 logo 看不见。现在浅色值搬进
   变量、深色另给一套，变量定义见文件开头（浅/深两套），
   浅色下的观感与之前逐像素一致。
   ============================================================ */

/* ---------- 全局背景 / 字体 ---------- */
html, body {
  background:
    radial-gradient(circle at 18% 8%, var(--v3-glow-1), transparent 28%),
    radial-gradient(circle at 88% 80%, var(--v3-glow-2), transparent 26%),
    var(--v3-bg) !important;
  color: var(--v3-text) !important;
}

body {
  letter-spacing: .005em;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--v3-scrollbar) transparent;
}

*::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

*::-webkit-scrollbar-thumb {
  background: var(--v3-scrollbar);
  border-radius: 99px;
}

button, input, select {
  font-family: inherit;
}

/* ---------- 顶部 Header ---------- */
header,
.topbar,
.head {
  background: var(--v3-header-bg) !important;
  border-bottom: 1px solid var(--v3-header-border) !important;
  box-shadow: var(--v3-header-shadow) !important;
  backdrop-filter: blur(14px);
}

.logo,
.brand {
  font-weight: 750 !important;
  letter-spacing: .02em;
}

/* ---------- 页面主体：更干净的工作台 ---------- */
.wrap {
  gap: 12px !important;
  padding: 12px 20px 16px !important;
  background: transparent !important;
}

/* ---------- 所有一级面板 ---------- */
.card,
.side > .card,
.main,
.hist,
.samples-wrap {
  background: var(--v3-panel) !important;
  border: 1px solid var(--v3-border) !important;
  border-radius: var(--v3-radius) !important;
  box-shadow: var(--v3-shadow) !important;
  overflow: hidden !important;
}

/* 去掉之前偏重的装饰线 */
.card::before,
.main::before,
.hist::before,
.samples-wrap::before {
  display: none !important;
}

/* ---------- 左侧：从“堆卡片”改成完整工作区 ---------- */
.side {
  gap: 10px !important;
  padding: 0 !important;
  background: transparent !important;
}

/* 卡片标题统一 */
.side .card-h,
.hist .card-h,
.samples-wrap .card-h {
  height: 42px !important;
  min-height: 42px !important;
  padding: 0 14px !important;
  background: var(--v3-card-h-bg) !important;
  border-bottom: 1px solid var(--v3-hairline) !important;
  color: var(--v3-text-2) !important;
  font-size: 11px !important;
  font-weight: 650 !important;
  letter-spacing: .035em;
}

.side .card-h::before,
.hist .card-h::before,
.samples-wrap .card-h::before {
  width: 5px !important;
  height: 5px !important;
  border-radius: 50% !important;
  background: var(--v3-primary) !important;
  box-shadow: 0 0 0 4px var(--v3-primary-soft) !important;
}

/* ---------- 上传区域：明显精致化 ---------- */
.side > .card:first-child .card-b {
  padding: 10px !important;
  background: var(--v3-panel-solid) !important;
}

.side .drop {
  height: 126px !important;
  min-height: 126px !important;
  padding: 10px !important;
  border: 1px dashed var(--v3-border-strong) !important;
  border-radius: 11px !important;
  background: var(--v3-drop-bg) !important;
  transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
}

.side .drop:hover {
  border-color: var(--v3-primary) !important;
  background: var(--v3-primary-soft) !important;
  box-shadow: inset 0 0 0 1px var(--v3-ring);
}

/* 空上传状态 */
.side .drop .idle {
  gap: 4px !important;
  color: var(--v3-text-3) !important;
}

.side .drop .idle .ico,
.side .drop .idle svg {
  width: 34px !important;
  height: 34px !important;
  padding: 8px !important;
  margin-bottom: 2px !important;
  border-radius: 10px !important;
  background: var(--v3-primary-soft) !important;
  color: var(--v3-primary) !important;
}

/* 上传提示文字 */
.side .drop .idle strong,
.side .drop .idle b {
  color: var(--v3-text-2) !important;
  font-size: 11px !important;
}

.side .drop .idle small {
  color: var(--v3-text-3) !important;
  font-size: 9px !important;
}

/* 有文件时：不要巨大缩略图 */
.side .drop.filled {
  height: 126px !important;
  padding: 7px !important;
}

.side .drop.filled .thumb {
  height: 110px !important;
  border-radius: 9px !important;
  background: var(--v3-inset) !important;
}

.side .drop.filled .thumb img {
  height: 79px !important;
  object-fit: contain !important;
}

.side .drop.filled .thumb .cap {
  height: 31px !important;
  padding: 5px 8px !important;
  font-size: 9px !important;
}

.side .drop.filled .thumb::after {
  bottom: 31px !important;
}

/* ---------- 识别参数：改造成紧凑的 Settings Panel ---------- */
.side-params {
  overflow: visible !important;
  height: auto !important;
  min-height: 0 !important;
  padding: 0 !important;
}

.side-params > .card {
  box-shadow: none !important;
}

.side-params .card-b {
  padding: 11px !important;
  background: var(--v3-panel-solid) !important;
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 8px 9px !important;
  align-items: end !important;
}

/* 每个字段像独立的小控件 */
.side-params .f {
  min-width: 0;
  margin: 0 !important;
}

.side-params .f > label {
  display: block !important;
  margin: 0 0 4px 1px !important;
  color: var(--v3-text-2) !important;
  font-size: 9.5px !important;
  line-height: 14px !important;
  font-weight: 560 !important;
}

.side-params .card-b > .f:first-child {
  grid-column: 1 / -1 !important;
}

/* 后端选择框作为主设置 */
.side-params select,
.side-params input[type="number"] {
  width: 100% !important;
  height: 34px !important;
  min-height: 34px !important;
  padding: 0 10px !important;
  border: 1px solid var(--v3-border-strong) !important;
  border-radius: 8px !important;
  background: var(--v3-panel-solid) !important;
  color: var(--v3-text) !important;
  font-size: 10.5px !important;
  outline: none !important;
  transition: all .16s ease;
}

.side-params select:hover,

/* ---------- 手机端 ---------- */
@media (max-width: 900px) {

  }
}

<header>

</header>

<div class="wrap">
  <!-- ══════════ 左：上传 + 配置 ══════════ -->
  <div class="side">

      <div class="split">

            <tbody id="tBody2"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <!-- ══════════ 左下：识别记录 ══════════ -->
  <div class="hist">

            <button id="copyMd">复制全文</button>

      </div>
    </section>
  </div>
</div>
