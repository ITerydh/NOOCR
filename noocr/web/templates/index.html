<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOOCR · 文字识别</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1e222b;
  --border: #2a2f3a;
  --text: #e6e8ec;
  --text-dim: #9aa1ad;
  --text-mute: #6b7280;
  --accent: #5b8cff;
  --accent-dim: #3a5bbf;
  --ok: #34d399;
  --warn: #fbbf24;
  --err: #f87171;
  --radius: 12px;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7; --panel: #fff; --panel-2: #fafbfc; --border: #e2e5ea;
    --text: #16181d; --text-dim: #5a6270; --text-mute: #8b93a1;
    --accent: #2563eb; --accent-dim: #1d4ed8;
    --ok: #059669; --warn: #b45309; --err: #dc2626;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 顶栏 ---------- */
header {
  display: flex; align-items: center; gap: 14px;
  padding: 0 24px; height: 56px;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.logo { display: flex; align-items: baseline; gap: 8px; }
.logo b { font-size: 16px; font-weight: 700; letter-spacing: .4px; }
.logo span { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
header .spacer { margin-left: auto; }
.pill {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--text-dim);
  padding: 4px 10px; border-radius: 20px;
  background: var(--panel-2); border: 1px solid var(--border);
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-mute); }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.dot.busy { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* 设备徽标：GPU 生效时点亮，降级到 CPU 时转为中性色 */
.pill.dev { font-family: var(--mono); letter-spacing: .2px; }
.pill.dev.gpu {
  color: #10b981;
  border-color: color-mix(in srgb, #10b981 45%, transparent);
  background: color-mix(in srgb, #10b981 12%, transparent);
}
.pill.dev.cpu { color: var(--text-mute); }
.pill.dev.err { color: #ef4444; border-color: #ef4444; }

/* ---------- 布局 ---------- */
.wrap { max-width: 1560px; margin: 0 auto; padding: 20px 24px 40px; }
.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1080px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.card + .card { margin-top: 16px; }
.card-h {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-size: 11.5px; font-weight: 600; letter-spacing: .7px;
  text-transform: uppercase; color: var(--text-mute);
}
.card-h .n { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; }
.card-b { padding: 16px; }

/* ---------- 拖放区 ---------- */
.drop {
  border: 1.5px dashed var(--border); border-radius: var(--radius);
  padding: 26px 16px; text-align: center; cursor: pointer;
  transition: .16s; background: var(--panel-2);
}
.drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel-2)); }
.drop .ico { font-size: 24px; opacity: .7; }
.drop .t { font-size: 13.5px; font-weight: 500; margin-top: 4px; }
.drop .h { font-size: 11.5px; color: var(--text-mute); margin-top: 2px; }
.file-chip {
  display: flex; align-items: center; gap: 8px; margin-top: 12px;
  padding: 8px 10px; border-radius: 8px; font-size: 12.5px;
  background: var(--panel-2); border: 1px solid var(--border);
}
.file-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip .sz { margin-left: auto; color: var(--text-mute); font-size: 11px; flex: none; }

/* ---------- 表单 ---------- */
.f { margin-bottom: 13px; }
.f:last-child { margin-bottom: 0; }
.f > label { display: block; font-size: 11.5px; color: var(--text-mute); margin-bottom: 5px; }
.row { display: flex; gap: 9px; }
.row > .f { flex: 1; margin-bottom: 13px; }
select, input[type=number] {
  width: 100%; padding: 8px 10px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); color: var(--text); font-family: inherit;
  transition: .14s;
}
select:hover, input[type=number]:hover { border-color: var(--text-mute); }
select:focus, input:focus { outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12.5px; color: var(--text-dim); }
.check input { accent-color: var(--accent); width: 14px; height: 14px; }

button {
  width: 100%; padding: 10px 14px; font-size: 13.5px; font-weight: 600;
  border: none; border-radius: 9px; cursor: pointer;
  background: var(--accent); color: #fff; font-family: inherit;
  transition: .14s; display: flex; align-items: center; justify-content: center; gap: 7px;
}
button:hover:not(:disabled) { background: var(--accent-dim); }
button:disabled { opacity: .5; cursor: not-allowed; }
.btn-line { display: flex; gap: 8px; margin-top: 9px; }
.btn-line button {
  flex: 1; padding: 7px 10px; font-size: 12px; font-weight: 500;
  background: var(--panel-2); color: var(--text-dim);
  border: 1px solid var(--border);
}
.btn-line button:hover:not(:disabled) {
  background: var(--panel); color: var(--accent); border-color: var(--accent);
}

/* ---------- 示例图 ---------- */
.samples { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.samples figure {
  position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
  cursor: pointer; border: 1.5px solid transparent; transition: .14s; background: var(--panel-2);
}
.samples img { width: 100%; height: 100%; object-fit: cover; display: block; }
.samples figure:hover { border-color: var(--accent); transform: translateY(-1px); }
.samples figure.on { border-color: var(--accent); }
.samples figcaption {
  position: absolute; inset: auto 0 0 0; padding: 10px 5px 3px;
  font-size: 10px; text-align: center; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.78));
}

/* ---------- 页签 ---------- */
.tabs {
  display: flex; gap: 2px; padding: 0 12px;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
.tabs button {
  width: auto; flex: none; padding: 11px 14px; font-size: 13px; font-weight: 500;
  background: none; color: var(--text-mute); border: none; border-radius: 0;
  border-bottom: 2px solid transparent; position: relative;
}
.tabs button:hover { background: none; color: var(--text-dim); }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .badge {
  margin-left: 5px; font-size: 10.5px; font-family: var(--mono);
  padding: 1px 5px; border-radius: 10px;
  background: var(--panel-2); color: var(--text-mute);
}
.tabs button.on .badge { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.pane { display: none; position: relative; }
.pane.on { display: block; }

/* ---------- 文本区 ---------- */
.out {
  width: 100%; min-height: 460px; padding: 18px 20px; font-size: 13.5px;
  font-family: var(--mono); line-height: 1.8; color: var(--text);
  background: transparent; border: none; outline: none; resize: vertical;
  white-space: pre-wrap; word-break: break-word;
  user-select: text; -webkit-user-select: text; cursor: text;
}
.out:empty::before { content: attr(data-ph); color: var(--text-mute); }

/* 只读文本区的悬浮操作条 */
.out-bar {
  position: absolute; top: 8px; right: 12px; display: flex; gap: 6px;
  opacity: 0; transition: opacity .18s ease; z-index: 3;
}
.pane:hover .out-bar { opacity: 1; }
.out-bar button {
  padding: 4px 10px; font-size: 11.5px; border-radius: 7px;
  background: var(--panel); color: var(--text-dim);
  border: 1px solid var(--border); backdrop-filter: blur(6px);
}
.out-bar button:hover { color: var(--accent); border-color: var(--accent); }
.out-bar button.ok { color: #10b981; border-color: #10b981; }

/* ---------- 图文对照 ---------- */
.viewer-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel-2);
}
.viewer-bar .stat { font-size: 11.5px; color: var(--text-mute); font-family: var(--mono); }
.viewer-bar .spacer { margin-left: auto; }
.zoom { display: flex; gap: 3px; }
.zoom button {
  width: 28px; height: 28px; padding: 0; border-radius: 6px; font-size: 14px;
  background: var(--panel); color: var(--text-dim); border: 1px solid var(--border);
}
.zoom button:hover:not(:disabled) { background: var(--panel-2); color: var(--accent); }
.pagepick { display: flex; gap: 3px; flex-wrap: wrap; max-width: 320px; }
.pagepick button {
  width: auto; padding: 3px 8px; font-size: 11.5px; font-weight: 500;
  border-radius: 6px; background: var(--panel); color: var(--text-dim);
  border: 1px solid var(--border); font-family: var(--mono);
}
.pagepick button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
.pagepick button.on {
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent); border-color: var(--accent);
}
.stage {
  position: relative; overflow: auto; max-height: 660px;
  background: repeating-conic-gradient(var(--panel-2) 0% 25%, var(--panel) 0% 50%) 50% / 18px 18px;
}
.viewer { position: relative; display: block; transform-origin: 0 0; }
.viewer img { display: block; max-width: none; }
.viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* 图文并排 */
.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.split .stage { max-height: 660px; border-right: 1px solid var(--border); }
@media (max-width: 900px) { .split .stage { border-right: none; border-bottom: 1px solid var(--border); } }
.split .side { display: flex; flex-direction: column; min-width: 0; }
.split .side .scroll { flex: 1; overflow: auto; max-height: 660px; }
.split .side .scroll table { font-size: 12.5px; }
.split .side thead th { padding: 8px 12px; }
.split .side tbody td { padding: 6px 12px; }
.split .side td.tx { line-height: 1.5; }
.split .side .bar .track { min-width: 26px; }
.hover-tip {
  position: fixed; z-index: 50; max-width: 300px; padding: 7px 10px;
  font-size: 12px; font-family: var(--mono); line-height: 1.5;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--accent); border-radius: 7px;
  box-shadow: 0 8px 24px rgba(0,0,0,.3); pointer-events: none;
  display: none; white-space: pre-wrap;
}

/* ---------- 统计条 ---------- */
.stats { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--border); }
.stats div {
  flex: 1; min-width: 96px; padding: 11px 16px; border-right: 1px solid var(--border);
}
.stats div:last-child { border-right: none; }
.stats .k { font-size: 10.5px; color: var(--text-mute); text-transform: uppercase; letter-spacing: .5px; }
.stats .v { font-size: 16px; font-weight: 650; font-family: var(--mono); margin-top: 1px; }
.stats .v.hl { color: var(--accent); }

/* ---------- 表格 ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 1;
  text-align: left; padding: 9px 16px; font-size: 11px; font-weight: 600;
  color: var(--text-mute); background: var(--panel-2);
  border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .4px;
}
tbody td { padding: 8px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr { cursor: pointer; transition: .1s; }
tbody tr:hover { background: var(--panel-2); }
tbody tr.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
td.n { font-family: var(--mono); font-size: 11.5px; color: var(--text-mute); width: 1%; white-space: nowrap; }
.bar { display: flex; align-items: center; gap: 7px; }
.bar .track { flex: 1; height: 4px; border-radius: 2px; background: var(--border); min-width: 40px; }
.bar .fill { height: 100%; border-radius: 2px; background: var(--ok); }
.bar.lo .fill { background: var(--err); }
.bar .pc { font-family: var(--mono); font-size: 11.5px; width: 42px; text-align: right; }

/* ---------- 提示条 ---------- */
.note {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 11px 14px; border-radius: 9px; font-size: 12.5px;
  margin: 14px 16px; line-height: 1.55;
}
.note.err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
.note.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
.note .x { margin-left: auto; cursor: pointer; opacity: .6; flex: none; }
.note .x:hover { opacity: 1; }
.hide { display: none !important; }

.empty { padding: 90px 24px; text-align: center; color: var(--text-mute); }
.empty .ico { font-size: 34px; opacity: .35; }
.empty .t { font-size: 13.5px; margin-top: 8px; }
.empty .h { font-size: 12px; margin-top: 3px; }

.spin {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.28); border-top-color: #fff;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
</style>
</head>
<body>
<header>
  <div class="logo"><b>NOOCR</b><span id="ver">·</span></div>
  <div class="spacer"></div>
  <div class="pill dev" id="devPill" title="推理设备"><span id="devName">·</span></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="status">连接中</span></div>
</header>

<div class="wrap">
  <div class="grid">
    <!-- ══════════ 左栏 ══════════ -->
    <div>
      <div class="card">
        <div class="card-h">输入</div>
        <div class="card-b">
          <div class="drop" id="drop">
            <div class="ico">⬆</div>
            <div class="t">点击或拖入文件</div>
            <div class="h">图片 · PDF · Word · Excel · PPT</div>
          </div>
          <input type="file" id="file" accept="image/*,.pdf,.docx,.xlsx,.pptx" hidden>
          <div class="file-chip hide" id="chip">
            <span>📄</span><span class="nm" id="chipNm"></span><span class="sz" id="chipSz"></span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">参数</div>
        <div class="card-b">
          <div class="f">
            <label for="backend">识别后端</label>
            <select id="backend"></select>
          </div>
          <div class="row">
            <div class="f">
              <label for="dpi">DPI（PDF）</label>
              <input type="number" id="dpi" value="200" min="72" max="600" step="10">
            </div>
            <div class="f">
              <label for="batch">批大小</label>
              <input type="number" id="batch" value="6" min="1" max="64" step="1">
            </div>
          </div>
          <div class="f">
            <label for="maxPages">最多页数（0 = 不限）</label>
            <input type="number" id="maxPages" value="0" min="0" step="1">
          </div>
          <div class="f" style="display:flex;gap:16px;flex-wrap:wrap">
            <label class="check"><input type="checkbox" id="showBox" checked>显示文本框</label>
            <label class="check"><input type="checkbox" id="onlyLow">仅看低置信</label>
          </div>
          <button id="run"><span>开始识别</span></button>
          <div class="btn-line">
            <button id="copyBtn">复制识别文本</button>
            <button id="dlBtn">导出 JSON</button>
            <button id="mdBtn">导出 MD</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">示例<span class="n" id="sampleN"></span></div>
        <div class="card-b">
          <div class="samples" id="samples"></div>
        </div>
      </div>
    </div>

    <!-- ══════════ 右栏 ══════════ -->
    <div>
      <div class="card">
        <div class="tabs" id="tabs">
          <button data-t="text" class="on">文本<span class="badge" id="bText">0</span></button>
          <button data-t="md">Markdown</button>
          <button data-t="view">图文对照<span class="badge" id="bBox">0</span></button>
        </div>

        <div class="note hide" id="note"><span id="noteTx"></span><span class="x" id="noteX">✕</span></div>

        <div class="pane on" id="p-text">
          <div class="out-bar">
            <button id="copyText">复制全文</button>
          </div>
          <div class="out" id="oText" data-ph="识别结果会显示在这里。"></div>
        </div>

        <div class="pane" id="p-md">
          <div class="out-bar">
            <button id="copyMd">复制全文</button>
          </div>
          <div class="out" id="oMd" data-ph="Markdown 预览"></div>
        </div>

        <div class="pane" id="p-view">
          <div class="viewer-bar">
            <span class="stat" id="vStat">—</span>
            <div class="pagepick hide" id="pagePick"></div>
            <div class="spacer"></div>
            <label class="check"><input type="checkbox" id="thresh">只看 ≥ <span id="thv">80</span>%</label>
            <input type="range" id="thr" min="0" max="100" value="80" style="width:88px">
            <div class="zoom">
              <button id="zOut" title="缩小">−</button>
              <button id="zRst" title="适应宽度" style="width:auto;padding:0 8px;font-size:11px">适应</button>
              <button id="zIn" title="放大">+</button>
            </div>
          </div>
          <div class="stats" id="stats"></div>
          <div class="split">
            <div class="stage" id="stage">
              <div class="empty" id="vEmpty">
                <div class="ico">🖼</div>
                <div class="t">上传文件后在此查看图文对照</div>
                <div class="h">点击左侧示例图可直接体验</div>
              </div>
              <div class="viewer hide" id="viewer">
                <img id="vImg" alt=""><canvas id="vCv"></canvas>
              </div>
            </div>
<div class="side">
      <div class="scroll" id="sideScroll">
                <table>
                  <thead><tr>
                    <th style="width:40px">#</th><th>文本</th>
                    <th style="width:108px">置信度</th><th style="width:48px">角度</th>
                  </tr></thead>
                  <tbody id="tBody2"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="hover-tip" id="tip"></div>

<script>
const $ = (id) => document.getElementById(id);
const SAMPLES = [
  ["ticket_train", "火车票"], ["id_card_china", "身份证"],
  ["receipt_bank_statement", "流水"], ["finance_shareholder_table", "股东表"],
  ["doc_comparison_table", "对照表"], ["exam_math_primary", "数学卷"],
  ["doc_english_single_column", "英文"], ["lang_japanese_poster", "日文"],
  ["scene_vertical_plaque", "竖排"], ["medical_lab_report", "化验单"],
  ["plate_vehicle_blue", "车牌"], ["doc_twocolumn_paper_highlight", "双栏"],
];

let file = null, result = null, pages = [], page = 0;
let srcUrl = null, zoom = 1, hoverIdx = -1, selIdx = -1, docId = "";

async function boot() {
  try {
    const [h, b, d] = await Promise.all([
      fetch("/health").then(r => r.json()),
      fetch("/api/backends").then(r => r.json()),
      fetch("/api/device").then(r => r.json()),
    ]);
    $("ver").textContent = "v" + h.version;
    $("dot").className = "dot on";
    $("status").textContent = "服务正常";
    $("backend").innerHTML = b.items.map(x => {
      const mb = ((x.det_mb || 0) + (x.rec_mb || 0)).toFixed(1);
      return `<option value="${x.name}"${x.default ? " selected" : ""}>` +
        `${x.label || x.name} · ${mb}MB</option>`;
    }).join("");
    showDevice(d);
  } catch (e) {
    $("status").textContent = "服务未连接";
    note("无法连接后端服务：" + e.message, "err");
  }
  buildSamples();
}

/* 设备徽标：显示实际生效的设备，而非请求值。
   请求 cuda 却跑在 CPU 上是最容易被忽略的性能陷阱，必须让用户看见。 */
function showDevice(d) {
  const pill = $("devPill");
  const isErr = /失败/.test(d.label || "");
  pill.className = "pill dev " + (isErr ? "err" : d.gpu_active ? "gpu" : "cpu");
  const short = d.kind === "cuda" ? "GPU" : d.kind === "cpu" ? "CPU" : (d.kind || "·");
  const name = d.name && d.name !== "unknown" ? esc(d.name) : "";
  $("devName").textContent = short + (name ? " · " + name : "");
  pill.title = `请求 ${d.prefer}｜实际 ${d.label || short}`;
}

function buildSamples() {
  const box = $("samples");
  SAMPLES.forEach(([key, label]) => {
    const fig = document.createElement("figure");
    fig.innerHTML = `<img src="/static/${key}.jpg" alt="${label}" loading="lazy">
      <figcaption>${label}</figcaption>`;
    fig.onclick = () => runSample(key, label, fig);
    fig.onerror = () => fig.remove();
    box.appendChild(fig);
  });
  $("sampleN").textContent = `${SAMPLES.length} 张`;
}

/* ---------- 输入 ---------- */
$("drop").onclick = () => $("file").click();
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => {
  e.preventDefault(); $("drop").classList.remove("over");
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
};
$("file").onchange = e => { if (e.target.files.length) setFile(e.target.files[0]); };

function setFile(f) {
  file = f;
  $("chip").classList.remove("hide");
  $("chipNm").textContent = f.name;
  $("chipSz").textContent = fmtSize(f.size);
  document.querySelectorAll(".samples figure").forEach(x => x.classList.remove("on"));
  if (f.type.startsWith("image/")) {
    setSrc(URL.createObjectURL(f));
  } else {
    $("viewer").classList.add("hide");
    $("vEmpty").classList.remove("hide");
  }
  run();
}

async function runSample(key, label, fig) {
  document.querySelectorAll(".samples figure").forEach(x => x.classList.remove("on"));
  if (fig) fig.classList.add("on");
  file = null;
  $("chip").classList.add("hide");
  setSrc(`/static/${key}.jpg`, `${label}.jpg`);
  const qs = `backend=${$("backend").value}` +
    `&dpi=${$("dpi").value}&max_pages=${$("maxPages").value}`;
  await runFetch(`/api/sample/${encodeURIComponent(key)}.jpg?${qs}`, "示例图");
}

function setSrc(url, name) {
  if (srcUrl && srcUrl.startsWith("blob:")) URL.revokeObjectURL(srcUrl);
  srcUrl = url;
  $("vImg").src = url;
  $("vEmpty").classList.add("hide");
  $("viewer").classList.remove("hide");
  if (name) $("vImg").alt = name;
  $("vImg").onload = () => { fitWidth(); };
  $("vImg").onerror = () => {
    $("viewer").classList.add("hide");
    $("vEmpty").classList.remove("hide");
  };
}

/* ---------- 识别 ---------- */
$("run").onclick = run;
$("backend").onchange = () => { if (result) run(); };

async function run() {
  if (!file) { note("请先选择文件，或点击左侧示例图", "warn"); return; }
  await runFetch("/api/ocr", "上传文件", true);
}

async function runFetch(url, label, useForm) {
  const btn = $("run");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span><span>识别中</span>';
  $("dot").className = "dot busy";
  $("status").textContent = "识别中";
  hideNote();
  try {
    let req;
    if (useForm) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("backend", $("backend").value);
      fd.append("dpi", $("dpi").value);
      fd.append("max_pages", $("maxPages").value);
      req = fetch(url, { method: "POST", body: fd });
    } else {
      req = fetch(url, { method: "POST" });
    }
    const res = await req;
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    apply(data);
    const w = (data.warnings || []).join("；");
    if (w) note(w, "warn");
  } catch (e) {
    note("识别失败：" + e.message, "err");
  } finally {
    btn.disabled = false;
    btn.innerHTML = "<span>开始识别</span>";
    $("dot").className = "dot on";
    $("status").textContent = "服务正常";
  }
}

function apply(d) {
  result = d;
  pages = d.pages || [];
  docId = d.doc_id || "";
  page = 0;
  selIdx = hoverIdx = -1;

  const all = pages.flatMap(p => p.lines);
  const native = d.native_text;
  $("oText").textContent = native || all.map(l => l.text).join("\n") || "";
  $("oMd").textContent = d.markdown || "";
  $("bText").textContent = all.length;
  $("bBox").textContent = all.length;
  $("bText").parentElement.classList.toggle("on", true);

  const avg = all.length ? all.reduce((a, l) => a + l.confidence, 0) / all.length : 0;
  const st = (pages[0] && pages[0].stages) || null;
  const det = st ? ((st.det_preprocess || 0) + (st.det_infer || 0) +
    (st.det_postprocess || 0)) : 0;
  const cells = [
    ["后端", d.backend], ["设备", st && st.device ? st.device : "·"],
    ["页数", d.page_count], ["文本行", all.length],
    ["平均置信", (avg * 100).toFixed(1) + "%", true], ["耗时", d.total_time + "s"],
  ];
  if (st) {
    cells.push(["检测", det.toFixed(0) + "ms"]);
    cells.push(["识别", (st.rec || 0).toFixed(0) + "ms"]);
  }
  $("stats").innerHTML = cells
    .map(([k, v, hl]) => `<div><div class="k">${k}</div><div class="v${hl ? " hl" : ""}">${v}</div></div>`)
    .join("");
  $("vStat").textContent = `${d.backend} · ${d.page_count} 页 · ${all.length} 行`;

  buildPagePick();
  gotoPage(0);
}

/* 页码按钮：仅多页时出现 */
function buildPagePick() {
  const box = $("pagePick");
  box.innerHTML = "";
  if (pages.length < 2) { box.classList.add("hide"); return; }
  box.classList.remove("hide");
  pages.forEach((_, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.onclick = () => gotoPage(i);
    box.appendChild(b);
  });
}

/* 切页：图片、明细表、标注三者同步 */
function gotoPage(i) {
  if (!pages.length) return;
  page = Math.max(0, Math.min(i, pages.length - 1));
  selIdx = hoverIdx = -1;

  const p = pages[page];
  if (p.has_image && docId) {
    setSrc(`/api/page/${docId}/${page}?v=${result.total_time}`, `第 ${page + 1} 页`);
  }

  const lines = p.lines || [];
  const base = pages.slice(0, page).reduce((a, q) => a + (q.lines || []).length, 0);
  $("tBody2").innerHTML = lines.length
    ? lines.map((l, k) => `<tr data-i="${k}">
        <td class="n">${base + k + 1}</td>
        <td class="tx">${esc(l.text)}</td>
        <td><div class="bar${l.confidence < 0.8 ? " lo" : ""}">
          <div class="track"><div class="fill" style="width:${(l.confidence * 100).toFixed(0)}%"></div></div>
          <span class="pc">${(l.confidence * 100).toFixed(0)}%</span></div></td>
        <td class="n">${l.angle}°</td></tr>`).join("")
    : `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-mute)">本页无文本行</td></tr>`;

  [...$("pagePick").children].forEach((b, k) => b.classList.toggle("on", k === page));
  $("stage").scrollTop = 0;
  $("stage").scrollLeft = 0;
  $("sideScroll").scrollTop = 0;
  requestAnimationFrame(() => { fitWidth(); draw(); });
}

/* ---------- 页签 ---------- */
const TABS = ["text", "md", "view"];

function tab(t) {
  [...$("tabs").children].forEach(x => x.classList.toggle("on", x.dataset.t === t));
  TABS.forEach(k => $("p-" + k).classList.toggle("on", k === t));
  if (t === "view") requestAnimationFrame(fitWidth);
}
$("tabs").onclick = e => {
  const b = e.target.closest("button");
  if (b) tab(b.dataset.t);
};

/* ---------- 图文对照 ---------- */
$("vImg").onmousemove = e => {
  if (!result || !pages.length) return;
  const i = hitTest(e);
  if (i !== hoverIdx) { hoverIdx = i; draw(); }
  const tip = $("tip");
  if (i < 0) { tip.style.display = "none"; return; }
  const l = currentLines()[i];
  tip.textContent = `#${i + 1}  ${(l.confidence * 100).toFixed(1)}%  ${l.angle}°\n${l.text}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + "px";
  tip.style.top = (e.clientY + 16) + "px";
};
$("vImg").onmouseleave = () => {
  $("tip").style.display = "none";
  if (hoverIdx !== -1) { hoverIdx = -1; draw(); }
};
$("vImg").onclick = e => {
  selIdx = hitTest(e);
  syncRows();
  draw();
};
$("tBody2").onclick = e => {
  const tr = e.target.closest("tr");
  if (!tr || tr.dataset.i === undefined) return;
  selIdx = +tr.dataset.i;
  syncRows();
  draw();
  const el = tr.getBoundingClientRect();
  const st = $("stage").getBoundingClientRect();
  if (el.top < st.top || el.bottom > st.bottom) {
    tr.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
};

function syncRows() {
  [...$("tBody2").children].forEach(tr =>
    tr.classList.toggle("on", tr.dataset.i !== undefined && +tr.dataset.i === selIdx));
}

function currentLines() { return (pages[page] || {}).lines || []; }
function currentSize() {
  const p = pages[page] || {};
  return { w: p.width || $("vImg").naturalWidth, h: p.height || $("vImg").naturalHeight };
}

function hitTest(e) {
  const rect = $("vImg").getBoundingClientRect();
  const x = (e.clientX - rect.left) / zoom;
  const y = (e.clientY - rect.top) / zoom;
  const lines = currentLines();
  for (let i = lines.length - 1; i >= 0; i--) {
    const b = lines[i].box;
    if (!b) continue;
    const xs = b.map(p => p[0]), ys = b.map(p => p[1]);
    if (x >= Math.min(...xs) - 2 && x <= Math.max(...xs) + 2 &&
        y >= Math.min(...ys) - 2 && y <= Math.max(...ys) + 2) return i;
  }
  return -1;
}

function draw() {
  const cv = $("vCv"), img = $("vImg");
  if (!result || !pages.length || !img.naturalWidth) return;
  const { w, h } = currentSize();
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = "round";

  const min = +$("thr").value / 100;
  const only = $("thresh").checked;
  const lines = currentLines();
  const fsz = Math.max(11, Math.round(h * 0.018));

  lines.forEach((l, i) => {
    if (!l.box) return;
    if (only && l.confidence < min) return;
    const strong = l.confidence >= 0.9;
    const on = i === hoverIdx || i === selIdx;

    ctx.beginPath();
    l.box.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.lineWidth = on ? 3 : 1.6;
    ctx.strokeStyle = on ? "#5b8cff"
      : strong ? "rgba(52,211,153,.9)" : "rgba(248,113,113,.9)";
    ctx.fillStyle = on ? "rgba(91,140,255,.18)"
      : strong ? "rgba(52,211,153,.08)" : "rgba(248,113,113,.06)";
    ctx.fill(); ctx.stroke();

    if (!on && fsz * 2 < h * 0.05) return;
    const [lx, ly] = l.box[0];
    const label = String(i + 1);
    ctx.font = `600 ${fsz}px ui-monospace, monospace`;
    const tw = ctx.measureText(label).width;
    const bx = Math.max(0, lx - 2), by = Math.max(fsz + 2, ly - fsz - 4);
    ctx.fillStyle = on ? "#5b8cff" : strong ? "#34d399" : "#f87171";
    ctx.fillRect(bx, by - fsz, tw + 9, fsz + 4);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, bx + 4.5, by - 3);
  });
}

$("showBox").onchange = draw;
$("onlyLow").onchange = draw;
$("thresh").onchange = () => { $("thv").textContent = $("thr").value; draw(); };
$("thr").oninput = () => { $("thv").textContent = $("thr").value; draw(); };

/* ---------- 缩放 ---------- */
function fitWidth() {
  const st = $("stage"), img = $("vImg");
  if (!img.naturalWidth) return;
  zoom = Math.min(1, (st.clientWidth - 4) / img.naturalWidth);
  applyZoom();
}
function applyZoom() {
  const img = $("vImg"), v = $("viewer");
  v.style.width = img.naturalWidth * zoom + "px";
  img.style.width = img.naturalWidth * zoom + "px";
  img.style.height = img.naturalHeight * zoom + "px";
  draw();
}
$("zIn").onclick = () => { zoom = Math.min(4, zoom * 1.25); applyZoom(); };
$("zOut").onclick = () => { zoom = Math.max(.1, zoom / 1.25); applyZoom(); };
$("zRst").onclick = fitWidth;
addEventListener("resize", () => { if (zoom < 1) fitWidth(); });

/* ---------- 工具 ---------- */

/* 复制：优先 Clipboard API，失败时回退到隐藏 textarea + execCommand */
async function copyText(text, btn) {
  if (!text) { note("暂无内容可复制", "warn"); return; }
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
  }
  note(ok ? `已复制 ${text.length} 个字符到剪贴板` : "复制失败，请手动选中复制",
       ok ? "warn" : "err");
  if (ok && btn) {
    const old = btn.textContent;
    btn.textContent = "已复制";
    btn.classList.add("ok");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1400);
  }
}

$("copyText").onclick = e => copyText($("oText").textContent, e.currentTarget);
$("copyMd").onclick = e => copyText($("oMd").textContent, e.currentTarget);
$("copyBtn").onclick = e => copyText($("oText").textContent, e.currentTarget);

$("dlBtn").onclick = () => save(
  (file?.name || "result").replace(/\.[^.]+$/, "") + ".json",
  JSON.stringify(result, null, 2), "application/json");
$("mdBtn").onclick = () => save(
  (file?.name || "result").replace(/\.[^.]+$/, "") + ".md",
  $("oMd").textContent, "text/markdown");

function save(name, content, mime) {
  if (!content) { note("暂无内容可导出", "warn"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 提示 ---------- */
function note(msg, kind) {
  $("noteTx").textContent = msg;
  $("note").className = "note " + (kind || "warn");
}
function hideNote() { $("note").classList.add("hide"); }
$("noteX").onclick = hideNote;

/* ---------- 工具函数 ---------- */
function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

boot();
</script>
