let sampleKey = null;

/* 识别记录：本次会话内历次识别的快照。放内存而不落盘——
   浏览器端没有可靠的文件系统权限，且用户要的是「这次会话里我跑了什么」。 */
const history = [];

async function boot() {
  try {
    const [h, b, d] = await Promise.all([
      fetch("/health").then(r => r.json()),
      fetch("/api/backends").then(r => r.json()),
      fetch("/api/device").then(r => r.json()),
    ]);
    $("ver").textContent = "v" + h.version;
    $("dot").className = "dot on";
    $("status").textContent = "服务正常";
    $("backend").innerHTML = b.items.map(x => {
      const mb = ((x.det_mb || 0) + (x.rec_mb || 0)).toFixed(1);
      backendLabels[x.name] = deriveShortLabel(x.label, x.name);
      return `<option value="${x.name}"${x.default ? " selected" : ""}>` +
        `${x.label || x.name} · ${mb}MB</option>`;
    }).join("");
    showDevice(d);
  } catch (e) {
    $("status").textContent = "服务未连接";
    note("无法连接后端服务：" + e.message, "err");
  }
  buildSamples();
}

/* ---------- 设备切换 ---------- */

/* 设备选项。hint 是给人看的代价说明，why 在不可用时说明原因。 */
const DEVICES = [
  { id: "auto", tag: "AUTO", name: "自动", hint: "有GPU 就用" },
  { id: "cuda", tag: "GPU", name: "显卡", hint: "最快" },
  { id: "cpu", tag: "CPU", name: "处理器", hint: "兼容性最好" },
];

/* 最近一次探测结果，下拉里要用来判断某项是否可选 */
let devInfo = null;

/* 设备徽标：显示**实际生效**的设备，而非请求值。
   请求cuda 却跑在 CPU 上是最容易被忽略的性能陷阱，必须让用户看见。 */
function showDevice(d) {
  devInfo = d;
  const pill = $("devPill");
  const isErr = !d.usable;
  /* 类名必须带 tool——按钮基类负责尺寸与基线对齐，
     这里只追加状态色。写成 "pill dev" 会丢掉全部新样式。 */
  pill.className = "tool dev " + (isErr ? "err" : d.gpu_active ? "gpu" : "cpu");
  const short = d.kind === "cuda" ? "GPU" : d.kind === "cpu" ? "CPU" : (d.kind || "·");
  /* name 与短标签同义时不能重复拼——CPU 设备的 name 本身就是
     "CPU"，无条件拼成 "CPU · CPU" 就是同一行出现两个一样的词。
     GPU 的 name 是显卡型号，与 "GPU" 不同义，保留可读性更好。 */
  const raw = (d.name || "").trim();
  const useless = !raw || raw.toLowerCase() === "unknown";
  const name = useless || raw.toLowerCase() === short.toLowerCase() ? "" : raw;
  $("devName").textContent = short + (name ? " · " + name : "");
  pill.title = `当前偏好 ${d.prefer}｜实际 ${d.label || short}（点击切换）`;
}

function toggleDevPop(force) {
  const pop = $("devPop");
  const open = force !== undefined ? force : pop.classList.contains("hide");
  if (open) renderDevPop();
  pop.classList.toggle("hide", !open);
  $("devPill").setAttribute("aria-expanded", String(open));
}

/* 渲染下拉。某项 disabled 表示后端判定该设备不可用，
   并把原因写出来——让用户知道是「没显卡」还是「缺 cuDNN」。 */
function renderDevPop() {
  const cur = devInfo ? devInfo.prefer : "auto";
  const gpuOk = !devInfo || devInfo.gpu_available !== false;
  $("devPop").innerHTML =
    `<div class="hd">推理设备</div>` +
    DEVICES.map(d => {
      const blocked = d.id === "cuda" && !gpuOk;
      /* 当前项本身失败时优先展示它的原因，它比「显卡不可用」更具体 */
      const why = (devInfo && !devInfo.usable && d.id === cur) ? devInfo.reason
        : blocked ? "本机无可用 GPU 环境（缺 CUDA/cuDNN，或装的是纯 CPU 版 onnxruntime）" : "";
      const dis = blocked && d.id !== cur ? " disabled" : "";
      return `<button data-dev="${d.id}"${d.id === cur ? ' class="on"' : ""}${dis}>
        <span class="tag">${d.tag}</span><span>${d.name}</span>
        <span class="hint">${blocked ? "不可用" : d.hint}</span>${why ? `<span class="why">${esc(why)}</span>` : ""}
      </button>`;
    }).join("") +
    (devInfo ? `<div class="sep"></div>
      <div class="hd" style="letter-spacing:0">实际：${esc(devInfo.label || devInfo.kind || "—")}</div>` +
      (devInfo.note ? `<div class="note">${esc(devInfo.note)}</div>` : "") : "");
}

/* 切换设备。GPU 首次加载要编译 CUDA kernel，约 2-3s，故显示忙态。 */
async function setDevice(id) {
  const pill = $("devPill");
  if (pill.classList.contains("busy")) return;
  pill.classList.add("busy");
  $("status").textContent = "切换设备中";
  try {
    const fd = new FormData();
    fd.append("device", id);
    const r = await fetch("/api/device", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) {
      note("切换失败：" + (d.detail || d.reason || "未知错误"), "err");
      await refreshDevice();
      return;
    }
    showDevice(d);
    const w = d.warmup && Object.values(d.warmup)[0];
    if (w && w !== "ok") {
      note("设备已切换，但模型加载失败：" + w, "err");
    } else {
      const s = d.gpu_active ? "GPU" : "CPU";
      note(`已切换到 ${s}${d.name && d.name !== "unknown" ? " · " + d.name : ""}`, "ok");
    }
    // 已切换则用当前后端重跑，让用户立刻看到差异
    if (result) run();
  } catch (e) {
    note("切换失败：" + e.message, "err");
  } finally {
    pill.classList.remove("busy");
    $("status").textContent = "服务正常";
    toggleDevPop(false);
  }
}

async function refreshDevice() {
  try {
    showDevice(await fetch("/api/device").then(r => r.json()));
  } catch { /* 服务已断开，保持旧显示 */ }
}

$("devPill").onclick = () => toggleDevPop();
$("devPill").onkeydown = e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleDevPop(); }
};
$("devPop").onclick = e => {
  const b = e.target.closest("button[data-dev]");
  if (b) setDevice(b.dataset.dev);
};
/* 点击外部关闭下拉；Esc 也关*/
document.addEventListener("click", e => {
  if (!e.target.closest(".devwrap")) toggleDevPop(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") toggleDevPop(false);
});

function buildSamples() {
  const box = $("samples");
  SAMPLES.forEach(([key, label]) => {
    const fig = document.createElement("figure");
    fig.innerHTML = `<img src="/static/${key}.jpg" alt="${label}" loading="lazy">
      <figcaption>${label}</figcaption>`;
    fig.onclick = () => runSample(key, label, fig);
    fig.onerror = () => fig.remove();
    box.appendChild(fig);
  });
  $("sampleN").textContent = `${SAMPLES.length} 张`;
}

/* ---------- 输入 ---------- */
$("drop").onclick = () => $("file").click();
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => {
  e.preventDefault(); $("drop").classList.remove("over");
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
};
$("file").onchange = e => { if (e.target.files.length) setFile(e.target.files[0]); };

function setFile(f) {
  file = f;
  sampleKey = null;
  showThumb(f);
  document.querySelectorAll(".samples figure").forEach(x => x.classList.remove("on"));
  run();
}

/* 上传区原地缩略图：图片直接铺在拖放框里，PDF/Office 显示类型徽标。
   不另开位置展示——用户在拖放点放下文件后，视线就在那里。 */
function showThumb(f) {
  const box = $("drop");
  box.classList.add("filled");
  const isImg = f.type.startsWith("image/");
  const url = isImg ? URL.createObjectURL(f) : null;
  if (thumbUrl) URL.revokeObjectURL(thumbUrl);
  thumbUrl = url;
  const ext = (f.name.split(".").pop() || "?").toUpperCase();
  box.innerHTML =
    `<div class="thumb">` +
      (isImg
        ? `<img src="${url}" alt="${esc(f.name)}">`
        : `<div class="ph"><span class="ext">${esc(ext)}</span><span>可预览首屏将显示在右侧</span></div>`) +
      `<div class="cap"><span class="nm">${esc(f.name)}</span>` +
      `<span class="sz">${fmtSize(f.size)}</span></div>` +
    `</div>`;
}

function clearThumb() {
  if (thumbUrl) { URL.revokeObjectURL(thumbUrl); thumbUrl = null; }
  $("drop").classList.remove("filled");
  $("drop").innerHTML =
    `<div class="idle"><div class="ico">⬆</div><div class="t">点击或拖入文件</div>` +
    `<div class="h">图片 · PDF · Word · Excel · PPT</div></div>`;
}

async function runSample(key, label, fig) {
  document.querySelectorAll(".samples figure").forEach(x => x.classList.remove("on"));
  if (fig) fig.classList.add("on");
  file = null;
  sampleKey = key;
  clearThumb();
  setSrc(`/static/${key}.jpg`, `${label}.jpg`);
  await run();
}

function setSrc(url, name) {
  if (srcUrl && srcUrl.startsWith("blob:")) URL.revokeObjectURL(srcUrl);
  srcUrl = url;
  $("vImg").src = url;
  $("vEmpty").classList.add("hide");
  $("viewer").classList.remove("hide");
  if (name) $("vImg").alt = name;
  $("vImg").onload = () => { autoFit = true; fitStage(); };
  $("vImg").onerror = () => {
    $("viewer").classList.add("hide");
    showEmpty("图片加载失败", "该文档可能已超出服务端缓存上限，请重新识别一次");
  };
}

/* 统一的空态入口：多处调用，文案必须能互相覆盖复原 */
function showEmpty(t, h) {
  $("vEmpty").querySelector(".t").textContent = t;
  $("vEmpty").querySelector(".h").textContent = h;
}

/* ---------- 识别 ---------- */
$("run").onclick = run;
$("backend").onchange = () => { if (result) run(); };
/* 参数改动也触发重跑：用户调了 DPI / 批大小却要手动再点一次开始，
   会以为改动没生效 */
["dpi", "maxPages", "batch"].forEach(id =>
  $(id).addEventListener("change", () => { if (result) run(); }));

/* 当前输入来源：上传的文件，或正在看的示例图。
   记成显式状态而不是靠 file 是否为 null 推断——示例图模式下 file 恒为
   null，若靠推断，切设备后点「重新识别」就会走进「请先选择文件」的
   死路，尽管界面上明明还显示着那张图。 */
async function run() {
  if (sampleKey) {
    const qs = new URLSearchParams({
      backend: $("backend").value,
      dpi: $("dpi").value,
      max_pages: $("maxPages").value,
      batch: $("batch").value,
    });
    await runFetch(`/api/sample/${encodeURIComponent(sampleKey)}.jpg?${qs}`, "示例图");
    return;
  }
  if (!file) { note("请先选择文件，或点击左侧示例图", "warn"); return; }
  await runFetch("/api/ocr", "上传文件", true);
}

/* 后端注册名 -> 界面短标签。统计条与历史记录共用，
   避免两处对同一个名字给出不同写法。

   标签由 boot() 从 /api/backends 拉到的 label 生成（"PP-OCRv6 medium"
   -> "v6 medium"），不在这里硬编码映射表——加新档位时后端注册表
   已经改过了，前端这张表若不同步就会漏 showing v6-medium 这种
   半截名字。之前加 medium 就漏过一次。 */
let backendLabels = {};

function shortBackend(name) {
  const raw = String(name || "");
  if (backendLabels[raw]) return backendLabels[raw];
  return raw.replace(/^ppocr/, "") || "—";
}

/* 从后端 label 推短标签：PP-OCRv6 medium -> v6 medium，
   PP-OCRv5 -> v5。统计条宽度有限，全名放不下。 */
function deriveShortLabel(label, name) {
  const m = /^PP-OCRv(\d+)(?:\s+(.+))?$/.exec(String(label || ""));
  if (!m) return name;
  return `v${m[1]}${m[2] ? " " + m[2].toLowerCase() : ""}`;
}

/* 统计条分两组渲染：核心 6 项平铺，耗时明细另起一行。
   8 项平铺时实测 1280 宽下断成 6+2、1080 下 7+1，断法不均；
   且换行会让统计条高度从 51px 涨到 101px，右栏图片区
   本就不宽裕，这一半高度比信息本身更值钱。耗时明细属于
   排障信息而非结果摘要，从属于核心指标是合理的层级关系。 */
function renderStats(cells) {
  const core = cells.slice(0, 6), detail = cells.slice(6);
  $("stats").innerHTML =
    core.map(([k, v, hl]) =>
      `<div><div class="k">${k}</div><div class="v${hl ? " hl" : ""}">${v}</div></div>`).join("") +
    (detail.length
      ? `<div class="srow">${detail.map(([k, v]) =>
          `<span><i>${k}</i><b>${v}</b></span>`).join("")}</div>`
      : "");
}

async function runFetch(url, label, useForm) {
  const btn = $("run");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span><span>识别中</span>';
  $("dot").className = "dot busy";
  $("status").textContent = "识别中";
  try {
    /* 新的识别请求让旧的失效：用户连点两次示例图时，
       先发的响应可能后到，会把结果覆盖成用户已经不想看的那张 */
    if (abortCtl) abortCtl.abort();
    abortCtl = new AbortController();
    let req;
    if (useForm) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("backend", $("backend").value);
      fd.append("dpi", $("dpi").value);
      fd.append("max_pages", $("maxPages").value);
      fd.append("batch", $("batch").value);
      req = fetch(url, { method: "POST", body: fd, signal: abortCtl.signal });
    } else {
      req = fetch(url, { method: "POST", signal: abortCtl.signal });
    }
    const res = await req;
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    apply(data);
    const w = (data.warnings || []).join("；");
    if (w) note(w, "warn");
  } catch (e) {
    /* 被新请求取代是正常路径，不该弹错误 */
    if (e.name !== "AbortError") note("识别失败：" + e.message, "err");
  } finally {
    btn.disabled = false;
    btn.innerHTML = "<span>开始识别</span>";
    $("dot").className = "dot on";
    $("status").textContent = "服务正常";
  }
}

function apply(d) {
  result = d;
  pages = d.pages || [];
  docId = d.doc_id || "";
  page = 0;
  selIdx = hoverIdx = -1;
  /* 缓存破坏键。原先用 total_time——同一张图两次识别耗时接近，
     浏览器会拿回旧图，表现为「重新识别了但标注还是上一轮的」。
     用单调递增的序号，每轮必定是新URL。 */
  runSeq += 1;
  /* 复原空态文案：看过历史记录后文案被改写过，
     新一轮识别成功后若不还原，会一直挂着「页面图不可用」的旧提示 */
  showEmpty("上传文件后在此查看图文对照", "点击右下角示例图可直接体验");

  const all = pages.flatMap(p => p.lines);
  const native = d.native_text;
  $("oText").textContent = native || all.map(l => l.text).join("\n") || "";
  $("oMd").textContent = d.markdown || "";
  $("bText").textContent = all.length;

  const avg = all.length ? all.reduce((a, l) => a + l.confidence, 0) / all.length : 0;
  const st = (pages[0] && pages[0].stages) || null;
  const det = st ? ((st.det_preprocess || 0) + (st.det_infer || 0) +
    (st.det_postprocess || 0)) : 0;
  /* 后端回传的是形如 "cuda:0 (NVIDIA ... 17.2GB)" 的完整串，
     统计条只放得下短标签，故按前缀归类。 */
  const dv = (pages[0] && pages[0].device) || "";
  const devTag = /^cuda|^(dml|cann|directml)/i.test(dv) ? "GPU" : dv ? "CPU" : "·";
  const cells = [
    ["后端", shortBackend(d.backend)], ["设备", devTag, devTag === "GPU"],
    ["页数", d.page_count], ["文本行", all.length],
    ["平均置信", (avg * 100).toFixed(1) + "%", true], ["耗时", d.total_time + "s"],
  ];
  /* 耗时明细归入次要分组，由 renderStats 统一处理分行 */
  if (st) {
    cells.push(["检测", det.toFixed(0) + "ms"]);
    cells.push(["识别", (st.rec || 0).toFixed(0) + "ms"]);
  }
  renderStats(cells);
  pushHistory(d, all);
  syncPageNav();
  gotoPage(0);
}

/* 页码导航。多页时用步进器（上一页 / 当前 / 下一页），
   64 页全列出来会把工具栏撑到换行，反而更难定位当前页。 */
function syncPageNav() {
  const step = $("pageStepper");
  step.classList.toggle("hide", pages.length < 2);
  $("pgTot").textContent = pages.length;
}

function gotoPage(i) {
  if (!pages.length) return;
  page = Math.max(0, Math.min(i, pages.length - 1));
  selIdx = hoverIdx = -1;

  const p = pages[page];
  if (p.has_image && docId) {
    setSrc(`/api/page/${docId}/${page}?v=${runSeq}`, `第 ${page + 1} 页`);
  }

  renderRows();
  $("pgCur").textContent = page + 1;
  $("pgPrev").disabled = page === 0;
  $("pgNext").disabled = page >= pages.length - 1;
  $("stage").scrollTop = 0;
  $("stage").scrollLeft = 0;
  $("sideScroll").scrollTop = 0;
  requestAnimationFrame(() => { fitStage(); draw(); });
}

$("pgPrev").onclick = () => gotoPage(page - 1);
$("pgNext").onclick = () => gotoPage(page + 1);

/* ---------- 识别记录 ---------- */
/* 上限 20 条：再往前的记录用户几乎不会再回头看，却一直占着内存。
   超限时丢最旧的——它们的价值随时间衰减得很快。 */
const HISTORY_MAX = 20;

function pushHistory(d, lines) {
  const srcName = file ? file.name : (d.source || (sampleKey || "示例图") + ".jpg");
  history.unshift({
    name: srcName,
    backend: d.backend,
    pages: d.page_count,
    lines: lines.length,
    time: d.total_time,
    at: new Date(),
    /* 快照：点回历史条目时后端文档可能已过期，图片取不到。
       存文本与坐标即可完整复原对照，图片则退化为空态提示。 */
    text: d.native_text || lines.map(l => l.text).join("\n"),
    markdown: d.markdown || "",
  });
  if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;
  renderHistory();
}

function renderHistory() {
  const box = $("histList");
  $("bHist").textContent = history.length;
  if (!history.length) {
    box.innerHTML = `<div class="hist-empty">还没有识别记录。<br>上传文件或点击右下角示例图开始。</div>`;
    return;
  }
  box.innerHTML = "";
  history.forEach((h, i) => {
    const el = document.createElement("div");
    el.className = "hist-item" + (i === 0 ? " on" : "");
    const t = h.at;
    const hh = String(t.getHours()).padStart(2, "0");
    const mm = String(t.getMinutes()).padStart(2, "0");
    const ss = String(t.getSeconds()).padStart(2, "0");
    el.innerHTML =
      `<span class="nm" title="${esc(h.name)}">${esc(h.name)}</span>` +
      `<span class="meta">${h.lines} 行 · ${h.time.toFixed(2)}s · ${hh}:${mm}:${ss}</span>` +
      `<button class="del" title="移除此记录" aria-label="移除此记录">✕</button>`;
    el.querySelector(".nm").onclick = () => restoreHistory(i);
    el.querySelector(".del").onclick = e => {
      e.stopPropagation();
      history.splice(i, 1);
      /* 删掉的若是当前正在查看的那条，且已无记录可看，才整体清空。
         只删历史中的一两条不该把当前结果也抹掉。 */
      if (i === 0 && !history.length) {
        result = null; pages = []; docId = ""; runSeq += 1;
        $("stats").innerHTML = ""; $("oText").textContent = ""; $("oMd").textContent = "";
        $("bText").textContent = "0";
        $("tBody2").innerHTML = "";
        $("viewer").classList.add("hide");
        $("vEmpty").classList.remove("hide");
        showEmpty("上传文件后在此查看图文对照", "点击右下角示例图可直接体验");
      }
      renderHistory();
    };
    box.appendChild(el);
  });
}

/* 复原历史记录：文本与统计能完整还原，但页面图取不回
   （后端 DocCache 按容量淘汰，旧文档已不在）。这里如实展示
   文本结果并提示图片不可用，而不是让图区空白让人以为出bug。 */
function restoreHistory(i) {
  const h = history[i];
  if (!h) return;
  $("oText").textContent = h.text;
  $("oMd").textContent = h.markdown;
  $("bText").textContent = h.text ? h.text.split("\n").filter(Boolean).length : 0;
  const lines = h.text ? h.text.split("\n").filter(Boolean).map(t => ({ text: t })) : [];
  pages = [{ page_index: 0, width: 0, height: 0, lines, has_image: false }];
  docId = "";
  page = 0;
  /* 走 renderStats 而非直接拼 innerHTML：两处各写一套的话，
     后端名归一、分组换行这些规则很快就会只在一处生效。 */
  renderStats([
    ["后端", shortBackend(h.backend)],
    ["记录时间", `${h.at.getHours()}:${String(h.at.getMinutes()).padStart(2, "0")}`],
    ["页数", h.pages], ["文本行", h.lines], ["耗时", h.time + "s"],
  ]);
  $("viewer").classList.add("hide");
  $("vEmpty").classList.remove("hide");
  showEmpty("这是历史记录的文本结果", "页面图仅在本次会话的当前结果中可用");
  $("sideScroll").innerHTML = `<table><tbody>${lines.map((l, k) =>
    `<tr><td class="n">${k + 1}</td><td class="tx" colspan="3">${esc(l.text)}</td></tr>`
  ).join("")}</tbody></table>`;
  renderHistory();
  /* 标记为当前查看的条目 */
  [...$("histList").children].forEach((el, k) => el.classList.toggle("on", k === i));
}

/* 明细表。onlyLow 打开时只留低置信行——排查识别质量时
   「哪些行没认准」比「全部行」有用得多。 */
function renderRows() {
  const lines = currentLines();
  const base = pages.slice(0, page).reduce((a, q) => a + (q.lines || []).length, 0);
  const onlyLow = $("onlyLow").checked;

  if (!lines.length) {
    $("tBody2").innerHTML =
      `<tr><td colspan="4" class="norow">本页无文本行</td></tr>`;
    return;
  }
  const rows = [];
  lines.forEach((l, k) => {
    const lo = l.confidence < 0.8;
    if (onlyLow && !lo) return;
    rows.push(`<tr data-i="${k}">
      <td class="n">${base + k + 1}</td>
      <td class="tx">${esc(l.text)}</td>
      <td><div class="bar${lo ? " lo" : ""}">
        <div class="track"><div class="fill" style="width:${(l.confidence * 100).toFixed(0)}%"></div></div>
        <span class="pc">${(l.confidence * 100).toFixed(0)}%</span></div></td>
      <td class="n">${l.angle}°</td></tr>`);
  });
  $("tBody2").innerHTML = rows.length
    ? rows.join("")
    : `<tr><td colspan="4" class="norow">本页无低置信行</td></tr>`;
  syncRows();
}

/* ---------- 页签（记录区：记录 / 文本 / Markdown）---------- */
const TABS = ["hist", "text", "md"];

function tab(t) {
  [...$("tabs").children].forEach(x => {
    const on = x.dataset.t === t;
    x.classList.toggle("on", on);
    /* role=tab 必须同步 aria-selected，否则读屏用户听到的是「全部未选中」 */
    x.setAttribute("aria-selected", String(on));
  });
  TABS.forEach(k => $("p-" + k).classList.toggle("on", k === t));
}
$("tabs").onclick = e => {
  const b = e.target.closest("button");
  if (b) tab(b.dataset.t);
};

/* ---------- 图文对照 ---------- */
$("vImg").onmousemove = e => {
  if (!result || !pages.length) return;
  const i = hitTest(e);
  if (i !== hoverIdx) { hoverIdx = i; draw(); }
  const tip = $("tip");
  if (i < 0) { tip.style.display = "none"; return; }
  const l = currentLines()[i];
  tip.textContent = `#${i + 1}  ${(l.confidence * 100).toFixed(1)}%  ${l.angle}°\n${l.text}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + "px";
  tip.style.top = (e.clientY + 16) + "px";
};
$("vImg").onmouseleave = () => {
  $("tip").style.display = "none";
  if (hoverIdx !== -1) { hoverIdx = -1; draw(); }
};
$("vImg").onclick = e => {
  selIdx = hitTest(e);
  syncRows();
  draw();
};
$("tBody2").onclick = e => {
  const tr = e.target.closest("tr");
  if (!tr || tr.dataset.i === undefined) return;
  selIdx = +tr.dataset.i;
  syncRows();
  draw();
  const el = tr.getBoundingClientRect();
  const st = $("stage").getBoundingClientRect();
  if (el.top < st.top || el.bottom > st.bottom) {
    tr.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
};

function syncRows() {
  [...$("tBody2").children].forEach(tr =>
    tr.classList.toggle("on", tr.dataset.i !== undefined && +tr.dataset.i === selIdx));
}

function currentLines() { return (pages[page] || {}).lines || []; }
function currentSize() {
  const p = pages[page] || {};
  return { w: p.width || $("vImg").naturalWidth, h: p.height || $("vImg").naturalHeight };
}

/* 容差按**屏幕像素**给，再换算回图像坐标。
   固定 ±2 图像像素在 zoom=0.25 时等于屏幕 0.5px，几乎点不中；
   在 zoom=4 时又等于 8px，容易误选相邻行。 */
const HIT_TOL_PX = 4;

function hitTest(e) {
  const rect = $("vImg").getBoundingClientRect();
  if (!rect.width) return -1;
  const x = (e.clientX - rect.left) / zoom;
  const y = (e.clientY - rect.top) / zoom;
  const tol = HIT_TOL_PX / zoom;
  const lines = currentLines();
  for (let i = lines.length - 1; i >= 0; i--) {
    const b = lines[i].box;
    if (!b) continue;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [px, py] of b) {
      if (px < x0) x0 = px;
      if (px > x1) x1 = px;
      if (py < y0) y0 = py;
      if (py > y1) y1 = py;
    }
    if (x >= x0 - tol && x <= x1 + tol && y >= y0 - tol && y <= y1 + tol) return i;
  }
  return -1;
}

/* 标注颜色从 CSS 变量读，这样主题切换后重绘即可跟随，
   不必在 JS 里维护两套色值（此前硬编码 #5b8cff/#34d399/#f87171，
   亮色主题下框几乎看不见）。 */
const cssVar = (n) =>
  getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let drawQueued = false;
function draw() {
  /* 同一帧内多次调用（如切页会连着改 zoom / selIdx）合并成一次绘制 */
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; paint(); });
}

function paint() {
  const cv = $("vCv"), img = $("vImg");
  if (!result || !pages.length || !img.naturalWidth) return;
  const { w, h } = currentSize();

  /* HiDPI：canvas 位图按设备像素比放大，否则在 2x 屏上框线发虚 */
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = "round";

  const min = +$("thr").value / 100;
  const only = $("thresh").checked;
  const showBox = $("showBox").checked;
  const lines = currentLines();
  const fsz = Math.max(11, Math.round(h * 0.018));

  if (!showBox) {
    /* 只画选中/悬停的那一个：关掉全部框后仍需能定位当前行 */
    lines.forEach((l, i) => {
      if (!l.box || (i !== hoverIdx && i !== selIdx)) return;
      paintBox(ctx, l, i, true, fsz, h, true);
    });
    return;
  }

  lines.forEach((l, i) => {
    if (!l.box) return;
    if (only && l.confidence < min) return;
    paintBox(ctx, l, i, i === hoverIdx || i === selIdx, fsz, h, false);
  });
}

function paintBox(ctx, l, i, on, fsz, h, hideLabel) {
  const accent = cssVar("--accent");
  const strong = l.confidence >= 0.9;
  /* 描边与填充共用同一个色值，只用 alpha 区分强弱。这样换主题时
     只要色值跟着变，浓淡关系自动保持——若用 hex 手工拼 rgba，
     换主题后浓度会失衡。 */
  const color = on ? accent
    : strong ? cssVar("--conf-high") : cssVar("--conf-low");

  ctx.beginPath();
  l.box.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.lineWidth = on ? 3 : 1.6;

  ctx.globalAlpha = on ? 0.18 : strong ? 0.10 : 0.07;
  ctx.fillStyle = color;
  ctx.fill();
  ctx.globalAlpha = on ? 1 : 0.85;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (hideLabel) return;
  /* 框太密时不画序号，否则标签互相压盖反而更乱 */
  if (!on && fsz * 2 < h * 0.05) return;
  const [lx, ly] = l.box[0];
  const label = String(i + 1);
  ctx.font = `600 ${fsz}px ui-monospace, monospace`;
  const tw = ctx.measureText(label).width;
  const bx = Math.max(0, lx - 2), by = Math.max(fsz + 2, ly - fsz - 4);
  ctx.fillStyle = color;
  ctx.fillRect(bx, by - fsz, tw + 9, fsz + 4);
  /* 序号文字取背景色，与标签底色对比最大且随主题自动反转 */
  ctx.fillStyle = cssVar("--bg");
  ctx.fillText(label, bx + 4.5, by - 3);
}

/* 阈值滑杆只在勾选后才生效。未勾选时拖动它毫无效果，
   却让人以为筛选没生效——控件说谎。 */
$("thresh").onchange = () => { syncThr(); draw(); };
$("thr").oninput = () => { $("thv").textContent = $("thr").value; draw(); };
function syncThr() {
  const on = $("thresh").checked;
  $("thr").disabled = !on;
  $("thr").style.opacity = on ? "1" : ".4";
}

$("showBox").onchange = draw;
$("onlyLow").onchange = renderRows;

/* ---------- 左栏参数区的滚动提示 ----------
   矮屏上参数区装不下时必须让用户知道「下面还有」，否则会以为
   批大小和开关根本不存在。scrollable 表示可滚，at-end 表示已到底，
   两者共同决定是否加底部渐隐。窗口缩放会改变是否溢出，故一并监听。 */
(function syncSideScroll() {
  const el = document.querySelector(".side-params");
  if (!el) return;
  const update = () => {
    const over = el.scrollHeight - el.clientHeight;
    el.classList.toggle("scrollable", over > 2);
    el.classList.toggle("at-end", over <= 2 || el.scrollTop >= over - 2);
  };
  el.addEventListener("scroll", update, { passive: true });
  addEventListener("resize", update);
  if (typeof ResizeObserver === "function") new ResizeObserver(update).observe(el);
  update();
})();

/* ---------- 缩放 ---------- */
/* 自适应：等比缩放到「整幅图刚好落在舞台内」，宽高取较小者。
   只按宽度算会让竖长图（票据、竖排招牌）底部被裁掉，
   用户看到的就只是半张图，却以为是识别漏了。 */
function fitStage() {
  const st = $("stage"), img = $("vImg");
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  /* 16 是给 viewer 的 8px 外边距留位；留 0 会让图正好贴边，
     视觉上像被切了一刀。 */
  const k = Math.min((st.clientWidth - 16) / w, (st.clientHeight - 16) / h);
  zoom = Math.min(3, Math.max(0.05, k));
  applyZoom();
}
/* 缩放的正确做法：**布局尺寸直接等于缩放后的尺寸**，
   内部再用一个固定原始尺寸的盒子做 transform。
   上一版把 viewer 布局尺寸设成原图尺寸、只靠 transform 缩放，
   滚动容器仍按原图算可滚动区域——于是图片只显示左上角一块、
   还冒出滚动条，缩放结果与可见区域完全对不上。
   现在 viewer 盒子= 缩放后尺寸，stage 的滚动范围与视觉一致。 */
function applyZoom() {
  const img = $("vImg"), v = $("viewer");
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  /* 外层：布局尺寸 = 缩放后尺寸，决定滚动区域与居中 */
  v.style.width = Math.round(w * zoom) + "px";
  v.style.height = Math.round(h * zoom) + "px";
  v.style.marginLeft = "";
  v.style.marginTop = "";
  /* 内层：恒定原始尺寸 + transform 缩放。
     位图只栅格化一次，放大到 3x 依然清晰（改 width/height 会重新
     栅格化并触发重排，放大后发糊）。 */
  img.style.width = w + "px";
  img.style.height = h + "px";
  img.style.transform = `scale(${zoom})`;
  const cv = $("vCv");
  cv.style.width = w + "px";
  cv.style.height = h + "px";
  cv.style.transform = `scale(${zoom})`;
  draw();
}
/* 舞台尺寸变化（窗口缩放、切页、明细表出现）都要重新适配，
   否则图会停在上一次的缩放比例上，出现大片留白或被裁切。 */
if (typeof ResizeObserver === "function") {
  new ResizeObserver(() => {
    if ($("viewer").classList.contains("hide")) return;
    if (autoFit) fitStage();
  }).observe($("stage"));
}

$("zIn").onclick = () => { autoFit = false; zoom = Math.min(4, zoom * 1.25); applyZoom(); };
$("zOut").onclick = () => { autoFit = false; zoom = Math.max(.05, zoom / 1.25); applyZoom(); };
$("zRst").onclick = () => { autoFit = true; fitStage(); };
addEventListener("resize", () => { if (autoFit) fitStage(); });

/* ---------- 工具 ---------- */

/* 复制：优先 Clipboard API，失败时回退到隐藏 textarea + execCommand */
async function copyText(text, btn) {
  if (!text) { note("暂无内容可复制", "warn"); return; }
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
  }
  note(ok ? `已复制 ${text.length} 个字符到剪贴板` : "复制失败，请手动选中复制",
       ok ? "ok" : "err");
  if (ok && btn) {
    const old = btn.textContent;
    btn.textContent = "已复制";
    btn.classList.add("ok");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1400);
  }
}

$("copyText").onclick = e => copyText($("oText").textContent, e.currentTarget);
$("copyMd").onclick = e => copyText($("oMd").textContent, e.currentTarget);
$("copyBtn").onclick = e => copyText($("oText").textContent, e.currentTarget);

$("dlBtn").onclick = () => save(
  (file?.name || "result").replace(/\.[^.]+$/, "") + ".json",
  JSON.stringify(result, null, 2), "application/json");
$("mdBtn").onclick = () => save(
  (file?.name || "result").replace(/\.[^.]+$/, "") + ".md",
  $("oMd").textContent, "text/markdown");

function save(name, content, mime) {
  if (!content) { note("暂无内容可导出", "warn"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 提示（toast）---------- */
/* 取代原先嵌在卡片里的横幅：横幅会占据版面并把下方内容整体下推，
   而「已复制」「已切换设备」这类信息用户根本不需要做操作。 */

const TOAST_ICON = { err: "✕", warn: "!", ok: "✓" };

function note(msg, kind) {
  const k = kind === "err" ? "err" : kind === "ok" ? "ok" : "warn";
  const box = $("toasts");
  const el = document.createElement("div");
  el.className = "toast " + k;
  /* 错误用 role=alert 立即打断读屏，普通提示走容器上的 aria-live */
  if (k === "err") el.setAttribute("role", "alert");
  el.innerHTML =
    `<span class="ico">${TOAST_ICON[k]}</span><span class="msg">${esc(msg)}</span>` +
    `<button class="x" aria-label="关闭提示">✕</button>`;
  const kill = () => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 200);
  };
  el.querySelector(".x").onclick = kill;
  box.appendChild(el);
  /* 错误留久一点：它通常需要用户据此行动 */
  setTimeout(kill, k === "err" ? 9000 : 3600);
  /* 最多同时留4 条，防止连续识别把屏幕塞满 */
  while (box.children.length > 4) box.firstElementChild.remove();
}

/* ---------- 主题 ---------- */
/* 三态：未设置→ 跟随系统；手动切换在 深色/浅色 之间。
   写 data-theme 到 <html> 让 CSS 的 :root[data-theme="light"] 生效，
   移除属性则回退到 @media (prefers-color-scheme) 那条规则。 */
const THEME_KEY = "noocr.theme";

function currentTheme() {
  const set = localStorage.getItem(THEME_KEY);
  if (set === "light" || set === "dark") return set;
  return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}

function applyTheme(t) {
  if (t === "light" || t === "dark") {
    document.documentElement.setAttribute("data-theme", t);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  /* 只改 title：按钮内是两个 SVG 图标，显隐由 CSS 按 data-theme 决定。
     早先这里写 textContent（☀ / ☾）会把 SVG 整个抹掉。 */
  $("themeBtn").title = (t === "light" ? "浅色" : "深色") + "主题，点击切换";
  /* canvas 标注色按 CSS 变量取，主题变了必须重绘，否则框还是旧主题的颜色 */
  draw();
}

/* 尚未手动设置时，系统主题变化要跟随 */
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
  if (!localStorage.getItem(THEME_KEY)) applyTheme(currentTheme());
});

$("themeBtn").onclick = () => {
  const next = currentTheme() === "light" ? "dark" : "light";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
};

/* 在脚本末尾 boot 前立即应用，避免深色用户看到一瞬间的白闪 */
applyTheme(currentTheme());

/* ---------- 全局拖放 + 粘贴 ---------- */
/* 拖放区只覆盖左侧一小块，用户从桌面往窗口里拖时命中率很低。
   在 window 上兜一份，并把整页作为拖放反馈区。 */
let dragDepth = 0;

addEventListener("dragenter", e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
  dragDepth++;
  document.body.classList.add("dragging");
});
addEventListener("dragleave", () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) document.body.classList.remove("dragging");
});
addEventListener("dragover", e => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault();
});
addEventListener("drop", e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  /* 已经由 drop 区处理过的不重复处理，否则会触发两次识别 */
  if (e.target.closest && e.target.closest("#drop")) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  setFile(e.dataTransfer.files[0]);
});

/* 粘贴图片：截图后直接 Ctrl+V 是最常见的输入方式 */
addEventListener("paste", e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) {
      const f = it.getAsFile();
      if (f) {
        e.preventDefault();
        /* 剪贴板里的文件没有名字，补一个带时间戳的便于导出 */
        setFile(new File([f], `粘贴_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.png`, { type: f.type }));
        return;
      }
    }
  }
});

/* ---------- 快捷键 ---------- */
addEventListener("keydown", e => {
  /* 输入类控件内不劫持按键，否则用户没法在输入框里打字 */
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;

  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); return; }
  if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) { e.preventDefault(); run(); return; }
  if (e.key === "o" || e.key === "O") { e.preventDefault(); $("file").click(); return; }
  if (e.key === "1") { tab("hist"); return; }
  if (e.key === "2") { tab("text"); return; }
  if (e.key === "3") { tab("md"); return; }
  if (e.key === "ArrowLeft" && pages.length > 1) { gotoPage(page - 1); return; }
  if (e.key === "ArrowRight" && pages.length > 1) { gotoPage(page + 1); return; }
  /* +/- 缩放。放在最后，避免和上面的数字键冲突判断 */
  if (e.key === "+" || e.key === "=") { zoom = Math.min(4, zoom * 1.25); applyZoom(); return; }
  if (e.key === "-") { zoom = Math.max(.1, zoom / 1.25); applyZoom(); return; }
  if (e.key === "0") { autoFit = true; fitStage(); return; }
});

/* ---------- 工具函数 ---------- */
function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* 控件初始态。必须在 DOM 就绪后统一调一次，否则 #thr 会停在可拖动
   但不生效的状态——这正是 P0 要消灭的「控件说谎」 */
syncThr();
renderHistory();
boot();
</script>
