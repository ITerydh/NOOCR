[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noocr"
version = "0.1.0"
description = "ONNX 全功能 OCR 系统：多后端统一、CPU 优先、开箱即用"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NOOCR Contributors" }]
keywords = ["ocr", "document-parsing", "onnxruntime", "paddleocr", "text-detection", "text-recognition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    # 用 -gpu 版：它是纯 CPU 版的超集，同时含 CPU/CUDA/TensorRT 三个 EP，
    # 装一个包即可覆盖两种场景，用户不必为GPU 重建环境。
    # 体积代价约 680MB（见 requirements-cpu.txt）。
    "onnxruntime-gpu>=1.20",
    "onnx>=1.16",
    "pydantic>=2.0",
    "loguru>=0.7",
    "pyclipper>=1.3",
]

[project.optional-dependencies]
# 仅 CPU 的轻量安装。onnxruntime 装好后需先 uninstall onnxruntime-gpu，
# 否则两个包会争抢同一个 onnxruntime 目录。
cpu = ["onnxruntime>=1.20"]

# 文档输入：PDF / Word / Excel / PPT
doc = [
    "pymupdf>=1.23",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
]

# Web 界面与 REST API
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

# 从 ModelScope 拉取权重
hub = ["modelscope>=1.20"]

all = ["noocr[doc,web,hub]"]

[project.scripts]
noocr = "noocr.cli:main"

[project.urls]
Homepage = "https://github.com/ITerydh/NOOCR"
Repository = "https://github.com/ITerydh/NOOCR"
Issues = "https://github.com/ITerydh/NOOCR/issues"
Weights = "https://www.modelscope.cn/models/iterhui/noocr-onnx"

[tool.setuptools.packages.find]
include = ["noocr*"]

[tool.setuptools.package-data]
noocr = ["web/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "slow: 需要下载模型或跑真实推理的慢测试",
    "gpu: 需要 NVIDIA GPU",
]